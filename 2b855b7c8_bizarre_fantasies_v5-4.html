/* ---------- habilidades ---------- */
function abilityNeedsEnemy(k){return ['smash-equip','execute','pierce-cc','lifesteal-cc','crush-cc','unblock-cc','pierce-ad','big-ad','double-ad','big-he','mark','skip-turn','silence','debuff'].includes(k);}
function abilityNeedsAlly(k){return ['shield-ally','heal-ally','revive'].includes(k);}
function useAbility(side,h,done){
  const k=h.akind, el=h.eliteMode; const foes=enemySide(side), allies=side;
  const finish=()=>{ h.abilityUsed=true; done(); };
  const need=abilityNeedsEnemy(k)?foes:abilityNeedsAlly(k)?allies:null;
  const run=(t)=>{
    switch(k){
      case 'aoe-cc':{const v=Math.round(stat(h,'cc')*0.8)+(el?5:0);living(foes).forEach(x=>{pushFx({k:'slash',toSide:tSide(x),toId:x.id});const d=dealDamage(x,v,{type:'melee'});pushLog('ld',`${h.name} (Torbellino) → ${x.name} (-${d}).`);});if(el)living(foes).forEach(x=>x.para=Math.max(x.para,1));break;}
      case 'aoe-ad':{const v=Math.round(stat(h,'ad')*0.8)+(el?4:0);living(foes).forEach(x=>{pushFx({k:'arrow',fromSide:side,fromId:h.id,toSide:tSide(x),toId:x.id,hits:1});const d=dealDamage(x,v,{type:'ranged',pierce:el?0.5:0});pushLog('ld',`${h.name} dispara en área → ${x.name} (-${d}).`);if(el)x._mods.push({ad:-2,turns:2});});break;}
      case 'aoe-he':{const v=Math.round(stat(h,'he')*0.9)+(el?5:0);living(foes).forEach(x=>{pushFx({k:'spell',toSide:tSide(x),toId:x.id,el:'rayo'});const d=dealDamage(x,v,{type:'spell',element:'rayo'});pushLog('ld',`${h.name} (magia en área) → ${x.name} (-${d}).`);});if(el)living(foes).forEach(x=>x.silence=Math.max(x.silence,1));break;}
      case 'debuff-all':{const a=el?6:4;living(foes).forEach(x=>{x._mods.push({cc:-a,ad:-a,he:-a,turns:el?2:1});pushFx({k:'status',side:tSide(x),id:x.id,txt:'▼'});});pushLog('li',`${h.name} -${a} a todos los rivales.`);if(el)heal(h,10);break;}
      case 'debuff':{const a=el?8:6;t._mods.push({cc:-a,ad:-a,he:-a,turns:el?99:2});const d=dealDamage(t,Math.round(stat(h,primKey(h.type))*0.6),{type:h.type==='HE'?'spell':h.type==='AD'?'ranged':'melee',element:'agua'});pushLog('li',`${h.name} debilita a ${t.name} (-${a}, -${d}).`);break;}
      case 'self-buff':{const a=el?9:6;h._mods.push({cc:a,ad:a,he:a,vel:el?6:4,turns:99});pushFx({k:'status',side:side,id:h.id,txt:'▲'});pushLog('lg',`${h.name} entra en furia (+${a}).`);break;}
      case 'self-heal':{const g=el?heal(h,h.maxHp):heal(h,12);pushLog('lh',`${h.name} se cura (+${g})${el?' ¡al máximo!':''}.`);if(el)living(allies).forEach(x=>{if(x!==h)heal(x,4);});break;}
      case 'shield-ally':{const v=el?22:14;t.shield+=v;pushFx({k:'shieldup',toSide:tSide(t),toId:t.id});pushLog('lg',`${h.name} escuda ${v} a ${t.name}.`);if(el)h._mods.push({cc:3,turns:99});break;}
      case 'heal-ally':{const g=heal(t,el?28:18);pushLog('lh',`${h.name} cura a ${t.name} (+${g}).`);if(el)t._mods.push({cc:3,turns:99});break;}
      case 'heal-all':{const v=el?12:9;living(allies).forEach(x=>{const g=heal(x,v);if(g)pushLog('lh',`${x.name} +${g}.`);});if(el)living(allies).forEach(x=>x._mods.push({cc:2,ad:2,he:2,turns:2}));pushLog('lh',`${h.name} cura al grupo.`);break;}
      case 'execute':{const thr=el?14:8;if(t.hp<=thr){pushFx({k:'slash',toSide:tSide(t),toId:t.id});t.hp=1;dealDamage(t,9999,{type:'true'});pushLog('lx',`${h.name} EJECUTA a ${t.name}.`);}else{const d=dealDamage(t,Math.round(stat(h,'cc')*0.6),{type:'melee'});pushLog('ld',`${h.name} no ejecuta (-${d}).`);}break;}
      case 'pierce-cc':{pushFx({k:'slash',toSide:tSide(t),toId:t.id});const d=dealDamage(t,stat(h,'cc')+(el?5:0),{type:'melee',ignoreShield:true,ignoreArmor:true});if(el)t.maxHp=Math.max(1,t.maxHp-5);pushLog('ld',`${h.name} atraviesa a ${t.name} (-${d}).`);break;}
      case 'lifesteal-cc':{pushFx({k:'slash',toSide:tSide(t),toId:t.id});const d=dealDamage(t,stat(h,'cc')+(el?3:0),{type:'melee'});const g=heal(h,Math.round(d*(el?1:0.5)));pushLog('ld',`${h.name} drena a ${t.name} (-${d}, +${g}).`);break;}
      case 'crush-cc':{const thr=el?0.6:0.4;let dmg=stat(h,'cc');if(t.hp/t.maxHp<=thr)dmg*=2;pushFx({k:'slash',toSide:tSide(t),toId:t.id});const d=dealDamage(t,dmg,{type:'melee'});pushLog('ld',`${h.name} aplasta a ${t.name} (-${d}).`);break;}
      case 'unblock-cc':{pushFx({k:'slash',toSide:tSide(t),toId:t.id});const d=dealDamage(t,stat(h,'cc'),{type:'melee',ignoreShield:true});pushLog('ld',`${h.name} golpe imbloqueable a ${t.name} (-${d}).`);if(el){const o2=living(foes).find(x=>x!==t);if(o2){const d2=dealDamage(o2,Math.round(stat(h,'cc')*0.7),{type:'melee',ignoreShield:true});pushLog('ld',`…y a ${o2.name} (-${d2}).`);}}break;}
      case 'smash-equip':{t.mwep=null;t.rwep=null;const had=!!t.armor;if(t.armor){t.maxHp=Math.max(1,t.maxHp-t.armor.hp);t.hp=Math.min(t.hp,t.maxHp);t.armor=null;}t.shield=0;pushFx({k:'slash',toSide:tSide(t),toId:t.id});const d=dealDamage(t,stat(h,'cc'),{type:'melee'});pushLog('lx',`${h.name} DESTRUYE el equipo de ${t.name}${had?' (armadura rota)':''} (-${d}).`);break;}
      case 'pierce-ad':{pushFx({k:'arrow',fromSide:side,fromId:h.id,toSide:tSide(t),toId:t.id,hits:1});const d=dealDamage(t,Math.round(stat(h,'ad')*1.2)+(el?5:0),{type:'ranged',pierce:1});pushLog('ld',`${h.name} dispara ignorando armadura (-${d}).`);break;}
      case 'big-ad':{pushFx({k:'arrow',fromSide:side,fromId:h.id,toSide:tSide(t),toId:t.id,hits:1});const d=dealDamage(t,Math.round(stat(h,'ad')*1.4)+(el?6:0),{type:'ranged',pierce:el?1:0.4});pushLog('ld',`${h.name} disparo demoledor a ${t.name} (-${d}).`);break;}
      case 'double-ad':{for(let i=0;i<2;i++){if(!t.alive)break;pushFx({k:'arrow',fromSide:side,fromId:h.id,toSide:tSide(t),toId:t.id,hits:1});const d=dealDamage(t,Math.round(stat(h,'ad')*0.9)+(el?3:0),{type:'ranged',pierce:el?0.5:0});pushLog('ld',`${h.name} dispara a ${t.name} (-${d}).`);}break;}
      case 'big-he':{pushFx({k:'spell',toSide:tSide(t),toId:t.id,el:'fuego'});const d=dealDamage(t,Math.round(stat(h,'he')*1.5)+(el?6:0),{type:'spell',element:'fuego',pierce:el?1:0});pushLog('ld',`${h.name} conjuro brutal a ${t.name} (-${d}).`);if(el){const o2=living(foes).find(x=>x!==t);if(o2){const d2=dealDamage(o2,Math.round(stat(h,'he')*0.9),{type:'spell',element:'fuego'});pushLog('ld',`…rebota en ${o2.name} (-${d2}).`);}}break;}
      case 'mark':{t.mark={dmg:el?9:6,turns:el?99:3};pushFx({k:'status',side:tSide(t),id:t.id,txt:'🎯'});const d=dealDamage(t,Math.round(stat(h,'ad')*0.6),{type:'ranged'});pushLog('li',`${h.name} marca a ${t.name} (+${el?9:6} daño).`);break;}
      case 'skip-turn':{t.skip=Math.max(t.skip,el?2:1);pushFx({k:'status',side:tSide(t),id:t.id,txt:'🚫'});pushLog('li',`${h.name} hace perder ${el?2:1} turno(s) a ${t.name}.`);break;}
      case 'silence':{t.silence=Math.max(t.silence,el?2:1);pushFx({k:'status',side:tSide(t),id:t.id,txt:'🔇'});const d=dealDamage(t,Math.round(stat(h,'he')),{type:'spell',element:'rayo'});pushLog('li',`${h.name} silencia a ${t.name} (-${d}).`);break;}
      case 'drain':{pushFx({k:'spell',toSide:tSide(t),toId:t.id,el:'agua'});const d=dealDamage(t,Math.round(stat(h,'he')*1.1)+(el?4:0),{type:'spell',element:'agua'});const ally=living(allies).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];const g=heal(ally,d);pushLog('ld',`${h.name} drena a ${t.name} (-${d}) y cura a ${ally.name} (+${g}).`);break;}
      case 'revive':{reviveHero(t,el?1:0.5);pushFx({k:'elite',side:tSide(t),id:t.id});pushLog('lx',`${h.name} revive a ${t.name}.`);break;}
      case 'evade':{h.evade=el?2:1;if(el)h._mods.push({cc:5,ad:5,turns:99});pushFx({k:'status',side:side,id:h.id,txt:'💨'});pushLog('li',`${h.name} se vuelve evasivo.`);break;}
      default:{const key=primKey(h.type);const ty=h.type==='HE'?'spell':h.type==='AD'?'ranged':'melee';const d=dealDamage(t,Math.round(stat(h,key)*1.3),{type:ty,element:'fuego'});pushLog('ld',`${h.name} usa ${h.ability} (-${d}).`);}
    }
    finish();
  };
  if(need){
    if(k==='revive'){ const dead=G.team[allies].filter(x=>!x.alive); if(dead.length===0){ const t2=living(allies).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];const g=heal(t2,15);pushLog('lh',`${h.name} no halla caídos; cura a ${t2.name} (+${g}).`);finish();return; } }
    if(humanCtl(side)){ if(k==='revive') pendTarget('Aliado CAÍDO a revivir',allies,run,{allowDead:true}); else pendTarget('Objetivo de '+(h.eliteMode?h.eAbility:h.ability),need,run); }
    else { let t; if(need===foes) t=living(foes).sort((a,b)=>a.hp-b.hp)[0]; else if(k==='revive') t=G.team[allies].find(x=>!x.alive); else t=living(allies).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0]; run(t); }
  } else run(null);
}

/* ---------- IA ---------- */
function aiTurn(h,side){
  if(B.over)return;
  const foes=living(enemySide(side)), allies=living(side);
  if(foes.length===0){ endTurn(); return; }
  const hurt=allies.filter(a=>a.hp/a.maxHp<0.4); const dead=G.team[side].filter(a=>!a.alive);
  if(dead.length){ const rIdx=(G.items[side]||[]).findIndex(o=>o.kind==='revive'||o.kind==='reviveAll'); if(rIdx>=0 && Math.random()<0.8){ useItem_AI(side,rIdx); return; } }
  if(hurt.length){
    const hIdx=(G.items[side]||[]).findIndex(o=>o.kind==='heal'||o.kind==='healBig'); if(hIdx>=0 && Math.random()<0.7){ useItem_AI(side,hIdx,hurt.sort((a,b)=>a.hp-b.hp)[0]); return; }
    if(canCast(side,h)){ const hs=affSpells(side,h).find(s=>s.kind==='heal1'||s.kind==='healAll'); if(hs && Math.random()<0.7){ castSpell_AI(side,h,hs,hurt.sort((a,b)=>a.hp-b.hp)[0]); return; } }
  }
  if(h.type==='HE' && h.maxMana>0 && (G.spellbook[side]||[]).length>0 && affSpells(side,h).length===0){
    const mIdx=(G.items[side]||[]).findIndex(o=>o.kind==='mana'||o.kind==='manaBig');
    if(mIdx>=0){ useItem_AI(side,mIdx); return; }
  }
  if(!h.abilityUsed && h.silence<=0 && Math.random()<0.6){ useAbility(side,h,()=>endTurn()); return; }
  if(h.type==='HE' && canCast(side,h)){ const ds=affSpells(side,h).filter(s=>['dmg1','dmg2','dmgAll','dmg1slow'].includes(s.kind)); if(ds.length){ castSpell_AI(side,h,pick(ds),foes.sort((a,b)=>a.hp-b.hp)[0]); return; } }
  if(h.type==='AD' && h.rwep){ rangedAttack(h,foes.sort((a,b)=>a.hp-b.hp)[0],side); endTurn(); return; }
  if(canCast(side,h)){ const any=affSpells(side,h).filter(s=>['dmg1','dmg2','dmgAll','dmg1slow'].includes(s.kind)); if(any.length){ castSpell_AI(side,h,pick(any),foes.sort((a,b)=>a.hp-b.hp)[0]); return; } }
  if(h.rwep){ rangedAttack(h,foes.sort((a,b)=>a.hp-b.hp)[0],side); endTurn(); return; }
  const t=foes.sort((a,b)=>a.hp-b.hp)[0]; pushFx({k:'slash',toSide:tSide(t),toId:t.id});
  const d=dealDamage(t,stat(h,'cc'),{type:'melee'}); pushLog('ld',`${h.name} golpea a ${t.name} (-${d}) cuerpo a cuerpo.`); endTurn();
}
function canCast(side,h){return (G.spellbook[side]||[]).length>0 && h.silence<=0 && affSpells(side,h).length>0;}
function affSpells(side,h){return (G.spellbook[side]||[]).map(id=>byId(SPELLS,id)).filter(s=>h.mana>=s.mana);}
function castSpell_AI(side,h,s,target){
  if(h.mana<s.mana){ const foes=living(enemySide(side)); const t=foes.sort((a,b)=>a.hp-b.hp)[0]||target; if(h.rwep){ rangedAttack(h,t,side);} else { pushFx({k:'slash',toSide:tSide(t),toId:t.id}); const d=dealDamage(t,stat(h,'cc'),{type:'melee'}); pushLog('ld',`${h.name} golpea (sin maná) a ${t.name} (-${d}).`);} endTurn(); return; }
  h.mana-=s.mana;
  demoNote('spell','🔮 Los Hechiceros lanzan magia gastando MANÁ (reserva para toda la batalla). El daño escala con su nivel de Magia.');
  const mag=stat(h,'he')/HE_REF, val=Math.max(1,Math.round(s.base*mag)), el=s.element;
  const foes=enemySide(side), allies=side; const sh=(t)=>pushFx({k:'spell',toSide:tSide(t),toId:t.id,el});
  switch(s.kind){
    case 'dmg1':{sh(target);const d=dealDamage(target,val,{type:'spell',element:el});pushLog('ld',`${h.name} lanza ${s.name} sobre ${target.name} (-${d}).`);break;}
    case 'dmg1slow':{sh(target);const d=dealDamage(target,val,{type:'spell',element:el});target._mods.push({vel:-4,turns:2});pushLog('ld',`${h.name} congela a ${target.name} (-${d}).`);break;}
    case 'dmg2':{living(foes).slice(0,2).forEach(t=>{sh(t);const d=dealDamage(t,val,{type:'spell',element:el});pushLog('ld',`${s.name} → ${t.name} (-${d}).`);});break;}
    case 'dmgAll':{living(foes).forEach(t=>{sh(t);const d=dealDamage(t,val,{type:'spell',element:el});pushLog('ld',`${s.name} → ${t.name} (-${d}).`);});break;}
    case 'heal1':{const g=heal(target,val);pushLog('lh',`${h.name} cura a ${target.name} (+${g}).`);break;}
    case 'healAll':{living(allies).forEach(t=>{const g=heal(t,val);if(g)pushLog('lh',`${t.name} +${g}.`);});break;}
    case 'shield':{target.shield+=val;pushFx({k:'shieldup',toSide:tSide(target),toId:target.id});pushLog('lg',`${h.name} escuda a ${target.name} (${val}).`);break;}
    case 'ward':{const a=living(allies).sort((x,y)=>x.hp-y.hp)[0]||target;a.wardVal=val;a.wardTurns=2;pushFx({k:'wardup',toSide:tSide(a),toId:a.id});pushLog('lg',`${h.name} protege a ${a.name} del daño mágico.`);break;}
    case 'sleep':{const p=clamp(0.35+stat(h,'he')/40,0.1,0.95);if(Math.random()<p){target.sleep=h.eliteMode?2:1;pushFx({k:'status',side:tSide(target),id:target.id,txt:'😴'});pushLog('li',`${h.name} duerme a ${target.name}.`);}else pushLog('li',`${h.name} falla el sueño.`);break;}
    case 'para':{const p=clamp(0.3+stat(h,'he')/40,0.1,0.9);if(Math.random()<p){target.para=1;pushFx({k:'status',side:tSide(target),id:target.id,txt:'⚡'});pushLog('li',`${h.name} paraliza a ${target.name}.`);}else pushLog('li',`${h.name} falla la parálisis.`);break;}
    case 'debuff':{const a=Math.max(2,val);target._mods.push({cc:-a,ad:-a,he:-a,turns:2});pushFx({k:'status',side:tSide(target),id:target.id,txt:'▼'});pushLog('li',`${h.name} maldice a ${target.name} (-${a}).`);break;}
    case 'buff':{const ally=living(allies).sort((x,y)=>velocity(y)-velocity(x))[0];const a=Math.max(2,val);ally._mods.push({cc:a,ad:a,he:a,turns:3});pushFx({k:'status',side:tSide(ally),id:ally.id,txt:'▲'});pushLog('lg',`${h.name} bendice a ${ally.name} (+${a}).`);break;}
    default:{sh(target);const d=dealDamage(target,val,{type:'spell',element:el});pushLog('ld',`${h.name} lanza ${s.name} (-${d}).`);}
  }
  endTurn();
}
function useItem_AI(side,idx,target){
  const o=G.items[side][idx], allies=side, foes=enemySide(side); const consume=()=>G.items[side].splice(idx,1);
  switch(o.kind){
    case 'heal': case 'healBig':{const t=target||living(allies).sort((a,b)=>a.hp-b.hp)[0];const g=heal(t,o.val);pushLog('lh',`${o.name}: ${t.name} +${g}.`);break;}
    case 'shield':{const t=living(allies).sort((a,b)=>velocity(b)-velocity(a))[0];t.shield+=o.val;pushFx({k:'shieldup',toSide:tSide(t),toId:t.id});pushLog('lg',`${o.name}: escudo a ${t.name}.`);break;}
    case 'cleanse':{const t=living(allies).find(a=>a.sleep||a.para||a.skip)||living(allies)[0];t.sleep=0;t.para=0;t.skip=0;pushLog('lh',`${o.name}: ${t.name} liberado.`);break;}
    case 'bomb':{const t=living(foes).sort((a,b)=>a.hp-b.hp)[0];pushFx({k:'spell',toSide:tSide(t),toId:t.id,el:'fuego'});const d=dealDamage(t,o.val,{type:'true'});pushLog('ld',`${o.name}: ${t.name} -${d}.`);break;}
    case 'mana': case 'manaBig':{const t=living(allies).filter(a=>a.maxMana>0).sort((a,b)=>(a.mana/a.maxMana)-(b.mana/b.maxMana))[0]||living(allies)[0];if(t){const b=t.mana||0;t.mana=Math.min(t.maxMana||0,(t.mana||0)+o.val);pushFx({k:'manaup',side:tSide(t),id:t.id,amt:t.mana-b});pushLog('lg',`${o.name}: ${t.name} +${t.mana-b} de maná.`);}break;}
    case 'revive':{const t=G.team[allies].find(a=>!a.alive);if(t){reviveHero(t,0.5);pushFx({k:'elite',side:tSide(t),id:t.id});pushLog('lx',`${o.name}: ¡${t.name} revive!`);}break;}
    case 'reviveAll':{let any=false;G.team[allies].forEach(t=>{if(!t.alive){reviveHero(t,0.5);any=true;}});pushLog('lx',`${o.name}: ${any?'todos reviven':'sin caídos'}.`);break;}
  }
  consume(); endTurn();
}

/* ===================== EFECTOS VISUALES (FX) ===================== */
let _localFx=[];
function pushFx(ev){ _fxQueue.push(ev); _localFx.push(ev); }   // (sobre-escribe la anterior)
function fxRoot(){ let r=$('fxRoot'); if(!r){ r=document.createElement('div'); r.id='fxRoot'; document.body.appendChild(r);} return r; }
function centerOf(side,id){ const el=$('b_'+side+'_'+id); if(!el)return null; const r=el.getBoundingClientRect(); return {x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height,el}; }
function spawn(node,ms){ fxRoot().appendChild(node); setTimeout(()=>{ if(node&&node.parentNode)node.parentNode.removeChild(node); },ms||1000); return node; }
function mk(cls,txt,x,y){ const d=document.createElement('div'); d.className=cls; if(txt!=null)d.innerHTML=txt; d.style.left=x+'px'; d.style.top=y+'px'; return d; }
const ELEM_COLOR={fuego:'#ff5a2a',hielo:'#5ad0ff',rayo:'#ffe14a',agua:'#3aa0ff',curacion:'#5fffa0',proteccion:'#ffd23a',arcano:'#c79bff',estado:'#c79bff'};
function flushFx(list){
  if(!list||!list.length)return;
  for(const ev of list){
    try{
      if(ev.k==='hit'){
        const c=centerOf(ev.side,ev.id); if(!c)continue;
        spawn(mk('fx-blood','',c.x,c.y),650);
        const col=ev.dtype==='spell'?'fx-dmg-spell':ev.dtype==='ranged'?'fx-dmg-ranged':'fx-dmg-melee';
        spawn(mk('fx-dmg '+col,'-'+ev.dmg,c.x+(rnd(30)-15),c.y-10),1050);
        c.el.classList.add('fx-shake'); setTimeout(()=>c.el&&c.el.classList.remove('fx-shake'),420);
      } else if(ev.k==='heal'){ const c=centerOf(ev.side,ev.id); if(!c)continue; spawn(mk('fx-ring fx-ring-heal','',c.x,c.y),700); spawn(mk('fx-dmg fx-dmg-heal','+'+ev.amt,c.x+(rnd(20)-10),c.y-10),1050);
      } else if(ev.k==='status'){ const c=centerOf(ev.side,ev.id); if(!c)continue; spawn(mk('fx-status',ev.txt,c.x,c.y-6),1100);
      } else if(ev.k==='miss'){ const c=centerOf(ev.side,ev.id); if(!c)continue; spawn(mk('fx-word','ESQUIVA',c.x,c.y-8),900);
      } else if(ev.k==='block'){ const c=centerOf(ev.side,ev.id); if(!c)continue; spawn(mk('fx-word fx-word-block','BLOQUEADO',c.x,c.y-8),900);
      } else if(ev.k==='negate'){ const c=centerOf(ev.side,ev.id); if(!c)continue; spawn(mk('fx-ring fx-ring-ward','',c.x,c.y),700); spawn(mk('fx-word fx-word-block','NEGADO',c.x,c.y-8),950);
      } else if(ev.k==='elite'){ const c=centerOf(ev.side,ev.id); if(!c)continue; spawn(mk('fx-ring fx-ring-elite','',c.x,c.y),800); spawn(mk('fx-word fx-word-elite','★ ÉLITE',c.x,c.y-10),1100);
      } else if(ev.k==='death'){ const c=centerOf(ev.side,ev.id); if(!c)continue; spawn(mk('fx-status','💀',c.x,c.y),1100);
      } else if(ev.k==='slash'){ const c=centerOf(ev.toSide,ev.toId); if(!c)continue; const s=mk('fx-slash','',c.x,c.y); spawn(s,360); c.el.classList.add('fx-shake'); setTimeout(()=>c.el&&c.el.classList.remove('fx-shake'),360);
      } else if(ev.k==='spell'){ const c=centerOf(ev.toSide,ev.toId); if(!c)continue; const b=mk('fx-burst','',c.x,c.y); b.style.background='radial-gradient(circle,'+(ELEM_COLOR[ev.el]||'#fff')+' 0%,rgba(0,0,0,0) 70%)'; spawn(b,520);
      } else if(ev.k==='shieldup'){ const c=centerOf(ev.toSide,ev.toId); if(!c)continue; spawn(mk('fx-ring fx-ring-shield','',c.x,c.y),700);
      } else if(ev.k==='wardup'){ const c=centerOf(ev.toSide,ev.toId); if(!c)continue; spawn(mk('fx-ring fx-ring-ward','',c.x,c.y),700);
      } else if(ev.k==='manaup'){ const c=centerOf(ev.side,ev.id); if(!c)continue; spawn(mk('fx-ring fx-ring-mana','',c.x,c.y),700); if(ev.amt)spawn(mk('fx-dmg fx-dmg-mana','+'+ev.amt,c.x+(rnd(16)-8),c.y-10),1000);
      } else if(ev.k==='arrow'){
        const a=centerOf(ev.fromSide,ev.fromId), b=centerOf(ev.toSide,ev.toId); if(!a||!b)continue;
        const ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
        const p=mk('fx-arrow','➤',a.x,a.y); p.style.transform='translate(-50%,-50%) rotate('+ang+'deg)';
        fxRoot().appendChild(p);
        requestAnimationFrame(()=>{ p.style.left=b.x+'px'; p.style.top=b.y+'px'; });
        setTimeout(()=>{ if(p.parentNode)p.parentNode.removeChild(p); spawn(mk('fx-burst','',b.x,b.y),360); },320);
      }
    }catch(e){}
  }
}

/* ===================== ROUTER DE INTENCIONES (host) ===================== */
function handleIntent(msg){
  if(!msg||msg.t!=='intent')return;
  const op=msg.op;
  // EQUIPAMIENTO (lado 'o' = cliente)
  if(op==='bid'){ if(G.phaseNeeds && G.phaseNeeds.o && !G.bidsIn.o) netBid(msg.heroId,msg.amount); return; }
  if(op==='pass'){ if(!G.bidsIn.o) netPass(); return; }
  if(op==='sell'){ netSell(); return; }
  if(op==='buySpell'){ buySpell('o',msg.id); return; }
  if(op==='buyObject'){ buyObject('o',msg.id); return; }
  if(op==='removeSpell'){ removeSpell('o',msg.i); return; }
  if(op==='removeItem'){ removeItem('o',msg.i); return; }
  if(op==='unequip'){ unequip('o',msg.heroId,msg.slot); return; }
  if(op==='doAssign'){ G.assign=msg.assign; doAssign('o',msg.heroId); return; }
  if(op==='eqdone'){ eqDone('o'); return; }
  // BATALLA (solo si es el turno de 'o')
  const isOturn = B && B.current && B.current.side==='o' && !B.over;
  const starters=['melee','ranged','ability','defend','castSpell','useItem'];
  if(starters.indexOf(op)>=0){
    if(!isOturn || B.pending) return;
    if(op==='melee') actMelee();
    else if(op==='ranged') actRanged();
    else if(op==='ability') actAbility();
    else if(op==='defend') actDefend();
    else if(op==='castSpell') castSpell(msg.id);
    else if(op==='useItem') useItem(msg.idx);
    return;
  }
  if(op==='target'){ if(B&&B.pending) pickTarget(msg.side,msg.id); return; }
  if(op==='cancel'){ if(B&&B.pending) cancelPending(); return; }
}

      <p>Esta demo salta directa al <b>combate</b>, que es lo más visual.</p>
    </div>
    <div style="text-align:center;margin-top:12px"><button class="btn primary big" onclick="closeModal();demoAuction();">Empezar demo ▶</button></div>`);
}
function demoAuction(){
  G.demo=true; G.demoExample=true; G.aIndex=0; G.subRound=0; G.curType='CC';
  G.pools={CC:shuffle(HEROES.filter(h=>h.type==='CC')),AD:shuffle(HEROES.filter(h=>h.type==='AD')),HE:shuffle(HEROES.filter(h=>h.type==='HE'))};
  G.cands=drawRaceSlate(G.pools.CC); G.phaseNeeds={p:true,o:true};
  G.bonus={p:pick(BONUS),o:pick(BONUS)}; G.bids={p:null,o:null}; G.bidsIn={p:false,o:false};
  G.coins={p:START_COINS,o:START_COINS};
  show('s-recruit'); renderRecruit('p');
  coach('PASO 1 · SUBASTA. Salen héroes, uno por raza (cada raza con su color y símbolo arriba). Los dos pujáis en SECRETO y el de mayor puja se lleva el héroe. Si pujáis por el mismo, se abre una nueva tanda. Esto es solo un ejemplo: pulsa abajo para continuar.');
  coachBtn('Ver el equipamiento ▶', demoEquip);
}
function demoEquip(){
  G.demoExample=true; G.eqSide='p'; show('s-equip'); renderEquip('p');
  coach('PASO 2 · EQUIPAMIENTO. A cada héroe le pones arma, armadura, hechizos (cuestan maná) y objetos. Al equipar verás cómo cambian sus stats. Las cartas de equipo van por colores según el tipo. Pulsa para empezar el combate.');
  coachBtn('Empezar el combate ▶', demoBattle);
}
function demoBattle(){ G.demoExample=false; startBattle(); }

window.addEventListener('DOMContentLoaded',()=>{ show('s-title'); });
