<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bizarre Fantasies v5</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Rubik:wght@400;500;600;700&display=swap');
:root{
  --bg:#120e1c; --bg2:#1a1430; --panel:#221a36; --panel2:#2b2244; --panel3:#332a4f;
  --ink:#efe9dc; --muted:#a89fbb; --soft:#8a8099; --line:#3c3158;
  --gold:#FFD24A; --gold2:#ffcf57; --gold-d:#b8902a;
  --cc:#ff7a7a; --ad:#5fe08a; --he:#8aa0ff; --hp:#ffd24a;
  --good:#3fd463; --warn:#ffcf57; --bad:#e0483b;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:
    radial-gradient(1200px 600px at 50% -10%, #2a2046 0%, rgba(42,32,70,0) 60%),
    linear-gradient(180deg,#15101f 0%, #0e0a16 100%);
  background-attachment:fixed;
  color:var(--ink); font-size:17px; line-height:1.45;
  min-height:100vh;
}
b{font-weight:700}
input{font-family:inherit}

/* ---------- pantallas ---------- */
.screen{display:none; padding:18px 16px 60px; max-width:1180px; margin:0 auto; animation:fade .35s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- títulos / botones ---------- */
.gtitle{font-family:'Cinzel',serif;font-weight:800;font-size:clamp(40px,9vw,80px);
  text-align:center;letter-spacing:3px;line-height:1.05;margin-top:8vh;
  background:linear-gradient(180deg,#fff3c8,#FFD24A 55%,#b8902a);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 4px 30px rgba(255,210,74,.25);}
.gsub{font-family:'Cinzel',serif;text-align:center;color:var(--gold2);letter-spacing:8px;
  font-size:clamp(14px,3vw,20px);margin:6px 0 30px;opacity:.9}
.title-emoji{text-align:center;font-size:clamp(40px,10vw,72px);margin-top:6vh;filter:drop-shadow(0 6px 16px rgba(0,0,0,.5))}
#s-title{text-align:center}
.title-links{margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.btn{font-family:inherit;font-weight:600;font-size:17px;color:var(--ink);
  background:linear-gradient(180deg,var(--panel3),var(--panel));
  border:1.5px solid var(--line);border-radius:12px;padding:13px 22px;cursor:pointer;
  transition:transform .08s, box-shadow .15s, border-color .15s; box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn:hover{border-color:var(--gold-d);transform:translateY(-1px)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.primary{background:linear-gradient(180deg,#ffe49a,var(--gold) 55%,#d8a431);color:#2a1d05;border-color:#ffe9a8;
  text-shadow:0 1px 0 rgba(255,255,255,.4);box-shadow:0 4px 0 #8a6a18}
.btn.primary:hover{filter:brightness(1.05)}
.btn.big{font-size:19px;padding:16px 30px;border-radius:14px}
.btn.sm{font-size:14px;padding:9px 14px;border-radius:10px}
.btn.disabled,.btn:disabled{opacity:.4;pointer-events:none}
.row-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}

/* ---------- setup / lobby ---------- */
.setup-box{max-width:560px;margin:6vh auto 0;background:var(--panel);border:1.5px solid var(--line);
  border-radius:var(--radius);padding:26px 24px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.setup-box h2{font-family:'Cinzel',serif;text-align:center;color:var(--gold);margin:0 0 18px;font-size:26px;letter-spacing:1px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.mode-card{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:18px 12px;text-align:center;cursor:pointer;transition:.15s}
.mode-card:hover{border-color:var(--gold-d)}
.mode-card.active{border-color:var(--gold);background:#2f2748;box-shadow:0 0 0 2px rgba(255,210,74,.2)}
.mode-icon{font-size:40px;line-height:1}
.mode-label{font-weight:700;font-size:19px;margin-top:8px}
.mode-sub{font-size:13.5px;color:var(--muted);margin-top:4px}
.ig{margin:12px 0}
.ig label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px;font-weight:500}
.ig input{width:100%;padding:13px 14px;font-size:17px;background:#15101f;border:1.5px solid var(--line);border-radius:10px;color:var(--ink)}
.ig input:focus{outline:none;border-color:var(--gold-d)}
.note-box{background:rgba(255,210,74,.08);border:1px solid rgba(255,210,74,.25);border-radius:10px;
  padding:12px 14px;font-size:14.5px;line-height:1.55;color:#e7e0d0}
.lobby-status{font-size:15px;color:var(--gold2);margin:14px 0;min-height:20px;text-align:center}
.lobby-hint{font-size:14px;color:var(--muted);margin:4px 0}
.room-code{font-family:'Cinzel',serif;font-weight:800;font-size:clamp(44px,12vw,72px);letter-spacing:10px;
  color:var(--gold);text-align:center;margin:8px 0;padding:10px 0;
  background:#15101f;border:2px dashed var(--gold-d);border-radius:14px}
.spinner{width:36px;height:36px;border:4px solid rgba(255,255,255,.18);border-top-color:var(--gold);
  border-radius:50%;margin:16px auto;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- cabeceras ---------- */
.r-header,.b-header{display:flex;justify-content:space-between;align-items:center;gap:14px;
  background:linear-gradient(180deg,var(--panel2),var(--panel));border:1.5px solid var(--line);
  border-radius:var(--radius);padding:14px 18px;margin-bottom:14px}
.r-title,.b-title{font-family:'Cinzel',serif;font-size:clamp(22px,4.5vw,30px);color:var(--gold);letter-spacing:1px;line-height:1.1}
.r-subtitle,.b-sub{font-size:14px;color:var(--muted);margin-top:4px}
.rules-link{color:var(--gold2);cursor:pointer;text-decoration:underline}
.phase-badge{font-weight:700;font-size:15px;padding:9px 16px;border-radius:999px;white-space:nowrap;color:#fff}
.pb-cc{background:linear-gradient(180deg,#d65454,#a83232)}
.pb-ad{background:linear-gradient(180deg,#3fb56a,#258048)}
.pb-he{background:linear-gradient(180deg,#5a6fe0,#3a48b0)}
.coins-row{display:flex;align-items:center;gap:8px;background:#15101f;border:1.5px solid var(--gold-d);border-radius:12px;padding:8px 14px}
.coins-num{font-family:'Cinzel',serif;font-weight:800;font-size:30px;color:var(--gold);line-height:1}
.coins-lbl{font-size:11px;color:var(--muted);line-height:1.2}

/* ---------- subasta layout ---------- */
.r-layout{display:grid;grid-template-columns:230px 1fr 230px;gap:14px;align-items:start}
.side-panel{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--radius);padding:14px}
.side-panel.side-you{border-color:var(--gold-d);box-shadow:0 0 0 2px rgba(255,210,74,.15)}
.side-name{font-weight:700;font-size:17px;color:var(--gold2);margin-bottom:8px;text-align:center}
.hand-lbl{font-size:12.5px;text-transform:uppercase;letter-spacing:1px;color:var(--soft);margin:10px 0 6px}
.slot-empty{font-size:13px;color:var(--soft);font-style:italic}
.bid-done{color:var(--good);font-weight:700;font-size:14px;text-align:center;margin:6px 0}
.bid-wait{color:var(--soft);font-size:13px;text-align:center;margin:6px 0}
.market-area{min-height:200px}
.market-status{font-size:15.5px;color:#e7e0d0;text-align:center;margin-bottom:12px}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;
  padding:6px 11px;border-radius:999px;margin:3px 4px 3px 0;color:#fff;background:#3a3155}
.chip-bon{background:linear-gradient(180deg,#2f9d54,#1f7a40)}
.chip-eqp{background:linear-gradient(180deg,#caa12f,#9a7a20);color:#1c1405}
.chip-res{background:linear-gradient(180deg,#c0506a,#8a2f48)}
.chip-spell{background:linear-gradient(180deg,#5a6fe0,#3a48b0)}
.chip-object{background:linear-gradient(180deg,#4a8f6a,#2f6b48)}
.chip-x{cursor:pointer;font-weight:800;background:rgba(0,0,0,.3);width:18px;height:18px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;font-size:13px;line-height:1}
.chip-x:hover{background:var(--bad)}
.hand-chips{display:flex;flex-wrap:wrap;gap:2px}

/* ---------- carta de héroe (subasta) ---------- */
.hcard{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1.5px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.35);
  display:flex;flex-direction:column;transition:.15s}
.hcard:hover{transform:translateY(-3px);border-color:var(--gold-d)}
.hcard-cost{position:absolute;top:8px;right:8px;z-index:2;background:#15101f;border:1.5px solid var(--gold);
  color:var(--gold);font-family:'Cinzel',serif;font-weight:800;font-size:18px;min-width:34px;height:34px;
  border-radius:50%;display:flex;align-items:center;justify-content:center}
.hcard-art{height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 30%, #3a2f55, #1c1730);border-bottom:1px solid var(--line)}
.hcard-art-emoji{font-size:42px;line-height:1}
.hcard-art-label{font-size:11px;color:var(--muted);margin-top:3px;font-style:italic}
.hcard-clan{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.hcard-type{font-size:12px;font-weight:800;padding:3px 9px;border-radius:6px;color:#fff;display:inline-block}
.hcard-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:7px;flex:1}
.hcard-name{font-weight:700;font-size:18px;line-height:1.1}
.hcard-title{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:-3px}
.hcard-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:2px}
.hstat{background:#15101f;border-radius:8px;padding:6px 2px;text-align:center}
.hstat-l{font-size:10px;color:var(--soft);letter-spacing:.5px}
.hstat-v{font-weight:800;font-size:18px;line-height:1.1}
.hcard-race{font-size:12px;color:#cdbff0;background:rgba(140,120,220,.12);border-radius:8px;padding:6px 8px;line-height:1.4}
.hcard-ability{font-size:12.5px;color:#d8d0e6;line-height:1.4}
.hcard-bid-zone{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.bid-mini-input{flex:1;width:100%;padding:9px;font-size:16px;text-align:center;background:#15101f;border:1.5px solid var(--line);border-radius:8px;color:var(--gold);font-weight:700}
.btn-bid-card{background:linear-gradient(180deg,#ffe49a,var(--gold) 60%,#d8a431);color:#2a1d05;font-weight:700;
  border:none;border-radius:8px;padding:9px 14px;cursor:pointer;font-size:15px;box-shadow:0 3px 0 #8a6a18}
.btn-bid-card:active{transform:translateY(1px)}

/* héroes adquiridos / stats mini */
.hero-acquired{background:#15101f;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:7px;cursor:pointer}
.hero-acquired:hover{border-color:var(--gold-d)}
.ha-name{font-weight:700;font-size:15px}
.ha-stats{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.sp{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:#2a2342;color:var(--ink)}
.sp-cc{background:rgba(255,122,122,.18);color:#ff9b9b}
.sp-ad{background:rgba(95,224,138,.16);color:#7eea9e}
.sp-he{background:rgba(138,160,255,.18);color:#a3b2ff}
.sp-hp{background:rgba(255,210,74,.16);color:#ffdf7a}

/* ---------- equipamiento ---------- */
.eq-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:16px;align-items:start}
.eq-heroes{display:flex;flex-direction:column;gap:12px}
.eq-hero{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;transition:.15s}
.eq-hero.eq-assignable{border-color:var(--gold);cursor:pointer;box-shadow:0 0 0 2px rgba(255,210,74,.25);animation:pulseGold 1.2s infinite}
@keyframes pulseGold{0%,100%{box-shadow:0 0 0 2px rgba(255,210,74,.2)}50%{box-shadow:0 0 0 4px rgba(255,210,74,.4)}}
.eq-hero.fuse{animation:fuse .6s}
@keyframes fuse{0%{transform:scale(1)}40%{transform:scale(1.04);box-shadow:0 0 24px var(--gold)}100%{transform:scale(1)}}
.eq-hero-name{font-weight:700;font-size:17px}
.eq-slot{background:#15101f;border:1px dashed var(--line);border-radius:9px;padding:9px 11px;margin-top:7px;
  font-size:13.5px;color:var(--soft);display:flex;justify-content:space-between;align-items:center;gap:8px}
.eq-slot.filled{border-style:solid;color:var(--ink);background:#221a36}
.eq-slot.filled.armor{border-color:#5a6fe0}
.slot-x{cursor:pointer;color:#fff;background:rgba(0,0,0,.35);width:22px;height:22px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.slot-x:hover{background:var(--bad)}
.eq-assign-hint{text-align:center;color:var(--gold);font-weight:700;font-size:13px;margin-top:8px}
.eq-hand-box{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:4px}
.shop-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.shop-tab{font-size:14px;font-weight:600;padding:9px 14px;border-radius:10px;background:var(--panel);border:1.5px solid var(--line);cursor:pointer}
.shop-tab:hover{border-color:var(--gold-d)}
.shop-tab.active{background:linear-gradient(180deg,#ffe49a,var(--gold) 60%,#d8a431);color:#2a1d05;border-color:#ffe9a8}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.shop-card{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1.5px solid var(--line);
  border-radius:11px;padding:12px 12px 14px;cursor:pointer;transition:.15s}
.shop-card:hover{transform:translateY(-2px);border-color:var(--gold-d)}
.shop-card.cant{opacity:.42;cursor:not-allowed}
.shop-cost{position:absolute;top:8px;right:8px;background:#15101f;border:1.5px solid var(--gold);color:var(--gold);
  font-weight:800;font-size:14px;min-width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.shop-name{font-weight:700;font-size:15.5px;padding-right:34px}
.shop-txt{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.4}
.shop-tag{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;color:#1c1405;background:var(--gold2);padding:2px 8px;border-radius:999px}

/* ---------- batalla ---------- */
.ctb-bar{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;overflow:hidden}
.ctb-label{font-size:12.5px;color:var(--soft);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.ctb-slots{display:flex;align-items:center;gap:4px;overflow-x:auto;padding-bottom:4px}
.ctb-slot{flex:0 0 auto;min-width:76px;background:#15101f;border:1.5px solid var(--line);border-radius:9px;padding:7px 8px;text-align:center}
.ctb-slot.ctb-active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,210,74,.3)}
.ctb-slot.ctb-p{border-left:4px solid #5a9fe0}
.ctb-slot.ctb-o{border-left:4px solid #e07a5a}
.ctb-hero-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctb-vel{font-size:11px;color:var(--gold2)}
.ctb-tt{font-size:10px;font-weight:800;border-radius:4px;padding:1px 4px;display:inline-block;color:#fff;margin-top:2px}
.ctb-who{font-size:10px;color:var(--soft);margin-top:2px}
.ctb-arrow{color:var(--soft);font-size:16px;flex:0 0 auto}
.tt-cc{background:#a83232}.tt-ad{background:#258048}.tt-he{background:#3a48b0}

.ia-think{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1.5px solid var(--line);
  border-radius:12px;padding:16px;text-align:center;font-size:17px;color:var(--gold2);margin-bottom:12px}
.ia-think.pending{border-color:var(--gold);color:var(--ink);box-shadow:0 0 0 2px rgba(255,210,74,.2)}

.b-grid{display:grid;grid-template-columns:1fr 44px 1fr;gap:10px;align-items:start;margin-bottom:14px}
.vs-mid{display:flex;align-items:center;justify-content:center;align-self:stretch}
.vs-txt{font-family:'Cinzel',serif;font-weight:800;color:var(--gold);font-size:20px;writing-mode:vertical-rl;text-orientation:upright;opacity:.7}
.army-panel{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:11px}
.army-panel.army-mine{border-color:var(--gold-d);box-shadow:0 0 0 1px rgba(255,210,74,.12)}
.army-name{font-weight:700;font-size:16px;color:var(--gold2);text-align:center;margin-bottom:9px}

.bhero{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1.5px solid var(--line);
  border-radius:11px;padding:10px 11px;margin-bottom:9px;cursor:pointer;transition:border-color .15s, box-shadow .15s}
.bhero.active-turn{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,210,74,.35),0 0 18px rgba(255,210,74,.15)}
.bhero.dead{opacity:.4;filter:grayscale(.8)}
.bhero.elite-mode{border-color:#ffaa00;background:linear-gradient(180deg,#3a2a1a,#2a2020)}
.bhero.targetable{border-color:var(--bad);box-shadow:0 0 0 2px rgba(224,72,59,.5);cursor:crosshair;animation:tgt 1s infinite}
@keyframes tgt{0%,100%{box-shadow:0 0 0 2px rgba(224,72,59,.45)}50%{box-shadow:0 0 0 4px rgba(224,72,59,.7)}}
.bhero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.bhero-name{font-weight:700;font-size:15.5px;line-height:1.15}
.vel-tag{font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:2px 6px;white-space:nowrap;flex-shrink:0}
.bhero-hpnum{font-size:13px;font-weight:700;color:#ffe7a8;margin:6px 0 3px}
.hp-bar{height:11px;background:#15101f;border-radius:6px;overflow:hidden;border:1px solid #00000055}
.hp-fill{height:100%;border-radius:6px;transition:width .4s ease}
.mp-bar{height:7px;background:#10204a;border-radius:5px;overflow:hidden;margin-top:4px;border:1px solid #00000055}
.mp-fill{height:100%;background:linear-gradient(90deg,#2f6fff,#5aa6ff);transition:width .4s ease}
.mp-num{font-size:11px;color:#86b4ff;margin-top:1px}
.bhero-status{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;min-height:2px}
.status-badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;color:#fff;background:#3a3155}
.st-shield{background:#caa12f;color:#1c1405}
.st-ward{background:#7a5fd0}
.st-sleep{background:#3a6fae}
.st-para{background:#b88a2a;color:#1c1405}
.st-mark{background:#c0506a}
.st-buff{background:#2f9d54}
.st-debuff{background:#9a3f3f}
.st-def{background:#4a5a7a}
.hand-section{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}

/* panel del héroe activo + menú JRPG */
.active-hero-panel{background:linear-gradient(180deg,#2a2244,var(--panel));border:2px solid var(--gold-d);
  border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:0 0 24px rgba(255,210,74,.12)}
.active-hero-title{font-size:14px;color:var(--gold2);text-transform:uppercase;letter-spacing:1px;text-align:center;margin-bottom:10px}
.active-hero-info{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.active-hero-name{font-family:'Cinzel',serif;font-size:22px;color:var(--gold);font-weight:700}
.active-hero-sub{font-size:13.5px;color:var(--muted);font-style:italic}
.active-hero-hp{font-size:15px;color:#ffe7a8;margin-top:4px;font-weight:600}
.active-stat-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vel-badge{font-size:13px;font-weight:700;padding:4px 10px;border-radius:7px;background:rgba(255,210,74,.15);color:var(--gold2)}
.equip-badge{font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:7px;background:#2a2342;color:#cdc3df}

/* notif */
#notifRoot{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:1100;display:none;width:max-content;max-width:92vw}
.notif-pop{background:linear-gradient(180deg,#2a2244,var(--panel));border:1.5px solid var(--gold);color:var(--ink);

@keyframes notifIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}

/* ===================== EFECTOS VISUALES ===================== */
#fxRoot{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
#fxRoot>*{position:absolute;pointer-events:none}
.fx-dmg{transform:translate(-50%,-50%);font-family:'Cinzel',serif;font-weight:800;font-size:32px;
  text-shadow:0 2px 6px #000,0 0 3px #000;animation:fxFloat 1s ease-out forwards}
.fx-dmg-melee{color:#ff5a5a}.fx-dmg-ranged{color:#8cff6a}.fx-dmg-spell{color:#a99bff}.fx-dmg-heal{color:#6affb0}
@keyframes fxFloat{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-210%) scale(1.15)}}
.fx-blood{width:96px;height:96px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(200,20,20,.9) 0%,rgba(150,0,0,.3) 45%,rgba(0,0,0,0) 70%);animation:fxBlood .65s ease-out forwards}
@keyframes fxBlood{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
.fx-shake{animation:fxShake .42s}
@keyframes fxShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.fx-ring{width:72px;height:72px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid #fff;animation:fxRing .7s ease-out forwards}
.fx-ring-heal{border-color:#6affb0}.fx-ring-shield{border-color:var(--gold)}.fx-ring-ward{border-color:#c79bff}
.fx-ring-elite{border-color:var(--gold);box-shadow:0 0 26px var(--gold)}
@keyframes fxRing{0%{opacity:.9;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.7)}}
.fx-status{transform:translate(-50%,-50%);font-size:36px;filter:drop-shadow(0 2px 4px #000);animation:fxFloat 1.1s ease-out forwards}
.fx-word{transform:translate(-50%,-50%);font-family:'Cinzel',serif;font-weight:800;font-size:19px;letter-spacing:1px;
  color:#fff;text-shadow:0 2px 6px #000;animation:fxFloat .95s ease-out forwards}
.fx-word-block{color:#9fd0ff}.fx-word-elite{color:var(--gold);font-size:24px}
.fx-slash{width:84px;height:84px;transform:translate(-50%,-50%) rotate(-30deg);
  background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%);animation:fxSlash .36s ease-out forwards}
@keyframes fxSlash{0%{opacity:0;transform:translate(-50%,-50%) rotate(-30deg) scale(.5)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(-30deg) scale(1.35)}}
.fx-burst{width:90px;height:90px;transform:translate(-50%,-50%);border-radius:50%;animation:fxBurst .52s ease-out forwards}
@keyframes fxBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}
.fx-arrow{transform:translate(-50%,-50%);font-size:28px;color:#ffe14a;text-shadow:0 0 8px #000,0 0 4px #ffcf57;
  transition:left .3s linear, top .3s linear;z-index:10000}

.cf-stat b{font-size:18px;font-weight:900}
.cf-cc b,.cf-cc span{color:#ff7a7a}.cf-ad b,.cf-ad span{color:#74e08f}.cf-he b,.cf-he span{color:#8ea2ff}
.cf-foot{background:#0a0710;padding:7px 9px 6px;border-top:1px solid rgba(255,255,255,.08)}
.cf-ability{font-size:11px;line-height:1.35;color:#e8e0f2;min-height:30px}
.cf-ability b{color:#ffcf6b}
.cardface.cf-elite{border-color:#ffb43a;box-shadow:0 8px 30px rgba(150,80,220,.4)}
.cardface.cf-elite .cf-art{background:radial-gradient(circle at 50% 34%,rgba(190,120,255,.30),rgba(0,0,0,0) 60%),linear-gradient(160deg,#3a1e5e,#140a22 72%)}
.cardface.cf-elite .cf-art-emoji{filter:drop-shadow(0 0 22px rgba(190,120,255,.85));opacity:1}
.cardface.cf-elite .cf-name{color:#ffe9b0;text-shadow:0 0 16px rgba(255,180,60,.85),0 2px 6px #000}

.bf-tag{display:flex;align-items:center;gap:6px;margin-top:4px;justify-content:flex-end}
.bf-mono{font-family:'Cinzel',serif;font-weight:800;font-size:14px;color:#FFD24A;border:1.5px solid #a9771f;border-radius:6px;
  padding:0 5px;letter-spacing:1px;background:linear-gradient(180deg,#2a2010,#16100a);text-shadow:0 1px 2px #000;line-height:1.3}
.bf-tag-txt{font-size:8px;color:#9a8f7a;letter-spacing:.2px}

.card-ctl{display:flex;gap:8px}
.card-ctl-btn{flex:1;background:#241a33;border:1.5px solid var(--line);color:#e8def6;border-radius:9px;padding:7px 4px;font-size:12.5px;font-weight:700;cursor:pointer}
.card-ctl-btn:hover{border-color:var(--gold-d);color:var(--gold2)}
.hcard-preview-note{text-align:center;font-size:12px;color:#ffb46b;background:#231526;border:1px dashed #6b4a2a;border-radius:8px;padding:7px}

.zoom-card{display:flex;flex-direction:column;align-items:center}
.zoom-flip{width:300px;max-width:82vw;height:560px;max-height:66vh;perspective:1500px}

/* equipamiento como cartas, color por tipo */
.shop-card{position:relative;padding-top:14px}
.shop-coin{position:absolute;top:9px;left:9px;width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#ffeaa6,#FFD24A 46%,#a9771f);border:2px solid #7c5410;
  display:flex;align-items:center;justify-content:center;font-weight:900;color:#5a3d06;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.shop-mana{position:absolute;top:11px;right:9px;background:#1b2b58;border:1px solid #46618c;color:#bcd2ff;font-size:11px;font-weight:800;border-radius:10px;padding:2px 8px}
.shop-name{margin-top:24px}
.shop-bf{display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:6px;opacity:.85}
.shop-bf .bf-mono{font-size:11px}
.shop-bf span{font-size:8.5px;color:#9a8f7a}
.eq-spell{border-top:3px solid #8b6bff}
.eq-melee{border-top:3px solid #e0653f}
.eq-ranged{border-top:3px solid #3fb56a}
.eq-armor{border-top:3px solid #5a8fd6}
.eq-object{border-top:3px solid #d6b13f}

/* evolución a élite en batalla */
.flip-in{animation:eliteRise .8s ease}
@keyframes eliteRise{0%{transform:scale(.72) rotate(-7deg);filter:brightness(2.2)}55%{transform:scale(1.1) rotate(2deg)}100%{transform:scale(1) rotate(0)}}

@media(max-width:520px){
  .flip3d{height:368px}
  .cf-art-emoji{font-size:76px}
  .cf-name{font-size:18px;padding:0 50px}
  .cards-grid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
  .zoom-flip{height:480px}
}

/* coach con botón de avance (demo paso a paso) */
.coach-body{display:flex;flex-direction:column;gap:9px;flex:1}
.coach-btn{align-self:flex-start;background:linear-gradient(180deg,#FFD24A,#c8941f);color:#2a1d05;font-weight:800;
  border:none;border-radius:10px;padding:9px 18px;font-size:14.5px;cursor:pointer;box-shadow:0 3px 10px rgba(255,200,60,.3)}
.coach-btn:hover{filter:brightness(1.08)}

</style>

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function rnd(n){return Math.floor(Math.random()*n);}
function pick(a){return a[rnd(a.length)];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function other(s){return s==='p'?'o':'p';}
function byId(arr,id){return (arr||[]).find(x=>x.id===id);}
function deep(o){return JSON.parse(JSON.stringify(o));}
function prof(h){return CLAN_PROFILE[h.clan]||{eliteHpPct:0.3,mMelee:0,mRanged:0,mSpell:0,mVel:0,manaBonus:0,regenBonus:0,resPhys:0,resMagic:0,trait:'',desc:''};}
function fmtMod(n){return (n>0?'+':'')+n;}

/* ===================== RED / ONLINE (PeerJS) ===================== */
const NET={ role:'local', peer:null, conn:null, mySide:'p', code:'', pass:'', status:'', names_self:'', names_opp:'' };
function online(){ return NET.role==='host'||NET.role==='client'; }
function netSend(obj){ try{ if(NET.conn&&NET.conn.open) NET.conn.send(obj); }catch(e){} }
function sendIntent(op,args){ netSend(Object.assign({t:'intent',op},args||{})); }
function makeCode(){const L='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<4;i++)c+=L[rnd(L.length)];return c;}

function hostCreate(name,pass,roomName){
  if(!window.Peer){ lobbyError('No se pudo cargar el módulo online (PeerJS). Revisa tu conexión, o usa el modo local.'); return; }
  NET.role='host'; NET.mySide='p'; NET.pass=pass||''; NET.names_self=name||'Jugador 1';
  NET.roomName=(roomName&&roomName.trim())||randomRoomName();
  NET.code=makeCode(); renderLobby('hostwait'); lobbyStatus('Creando sala…');
  NET.peer=new Peer('bizfan-'+NET.code,{debug:1});
  NET.peer.on('open',()=>{ lobbyStatus('Esperando a que se una el otro jugador…'); dirRegister(NET.code,NET.roomName,!!NET.pass); });
  NET.peer.on('connection',onHostConn);
  NET.peer.on('error',(e)=>{
    const t=(e&&e.type)||(''+e);
    if((''+t).indexOf('unavailable-id')>=0){
      try{NET.peer.destroy();}catch(_){}
      NET.code=makeCode(); renderLobby('hostwait');
      NET.peer=new Peer('bizfan-'+NET.code,{debug:1});
      NET.peer.on('open',()=>{ lobbyStatus('Esperando a que se una el otro jugador…'); dirRegister(NET.code,NET.roomName,!!NET.pass); });
      NET.peer.on('connection',onHostConn);
      NET.peer.on('error',(e2)=>lobbyError('Error de red: '+((e2&&e2.type)||e2)));
      return;
    }
    lobbyError('Error de red: '+t+'. Prueba de nuevo o usa el modo local.');
  });
}
function onHostConn(conn){
  NET.conn=conn;
  conn.on('open',()=>lobbyStatus('Jugador conectándose…'));
  conn.on('data',(msg)=>{
    if(msg&&msg.t==='hello'){
      if(NET.pass && msg.pass!==NET.pass){ netSend({t:'reject',reason:'Contraseña incorrecta.'}); setTimeout(()=>{try{conn.close();}catch(e){}},300); return; }
      NET.names_opp=msg.name||'Jugador 2';
      netSend({t:'welcome',hostName:NET.names_self});
      startOnlineGame();
    } else handleIntent(msg);
  });
  conn.on('close',()=>{ if(!G._gameOver) netDropped(); });
  conn.on('error',()=>{});
}
function clientJoin(code,pass,name){
  if(!window.Peer){ lobbyError('No se pudo cargar el módulo online (PeerJS). Revisa tu conexión, o usa el modo local.'); return; }
  NET.role='client'; NET.mySide='o'; NET.names_self=name||'Jugador 2';
  code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length<3){ lobbyError('Introduce un código de sala válido.'); return; }
  renderLobby('clientwait'); lobbyStatus('Conectando con la sala '+code+'…');
  NET.peer=new Peer({debug:1});
  NET.peer.on('open',()=>{
    const conn=NET.peer.connect('bizfan-'+code,{reliable:true}); NET.conn=conn;
    conn.on('open',()=>{ conn.send({t:'hello',name:NET.names_self,pass:pass||''}); lobbyStatus('Autenticando…'); });
    conn.on('data',(msg)=>{
      if(!msg)return;
      if(msg.t==='reject'){ lobbyError(msg.reason||'Conexión rechazada.'); try{conn.close();}catch(e){} return; }
      if(msg.t==='welcome'){ NET.names_opp=msg.hostName||'Jugador 1'; lobbyStatus('¡Conectado! Empezando…'); leaveLobbyForGame(); return; }
      if(msg.t==='snap'){ applySnapshot(msg); return; }
      if(msg.t==='end'){ G._gameOver=true; showResult(msg.pWin===(NET.mySide==='p')); return; }
    });
    conn.on('close',()=>{ if(!G._gameOver) netDropped(); });
    conn.on('error',()=>{});
  });
  NET.peer.on('error',(e)=>lobbyError('No se pudo conectar: '+((e&&e.type)||e)+'. Verifica el código y que el anfitrión tenga la sala abierta.'));
}
function netDropped(){ modal('<h3>Conexión perdida</h3><div class="modal-note" style="font-size:15px">Se ha perdido la conexión con el otro jugador.</div><div style="margin-top:16px;text-align:center"><button class="btn primary" onclick="location.reload()">Volver al inicio</button></div>'); }
function lobbyStatus(s){ NET.status=s; const el=$('lobbyStatus'); if(el){el.textContent=s;el.style.color='';} }
function lobbyError(s){ NET.status=s; const el=$('lobbyStatus'); if(el){el.textContent=s; el.style.color='#ff6b6b';} }
function startOnlineGame(){ G.oppHuman=true; G.online=true; leaveLobbyForGame(); initGame(NET.names_self,NET.names_opp,true); }

/* ===================== DIRECTORIO DE SALAS (experimental, P2P) ===================== */
const DIR_ID='bizfan-dir-v51';
const LOBBY={ role:null, peer:null, conn:null, conns:[], rooms:[], rid:null, ping:null, _reg:null };
const ROOM_ADJ=['Brava','Sombría','Dorada','Arcana','Salvaje','Élfica','Maldita','Épica','Rúnica','Carmesí','Glacial','Ardiente'];
const ROOM_NOUN=['Arena','Cripta','Taberna','Fortaleza','Hoguera','Guarida','Cumbre','Mazmorra','Quimera','Caverna'];
function randomRoomName(){ return 'Sala '+pick(ROOM_ADJ)+' '+pick(ROOM_NOUN); }
function isLobby(){ return G._scr==='s-lobby'; }

function enterLobby(){ NET.role='local'; show('s-lobby'); renderLobby('browse'); }
function upsertRoom(r){ const i=LOBBY.rooms.findIndex(x=>x.id===r.id); if(i>=0)LOBBY.rooms[i]=r; else LOBBY.rooms.push(r); }
function removeRoom(id){ LOBBY.rooms=LOBBY.rooms.filter(x=>x.id!==id); }
function touchRoom(id){ const r=LOBBY.rooms.find(x=>x.id===id); if(r)r.ts=Date.now(); }
function activeRooms(){ const now=Date.now(); LOBBY.rooms=LOBBY.rooms.filter(x=>now-(x.ts||0)<45000); return LOBBY.rooms; }
function broadcastList(){ const msg={t:'list',rooms:activeRooms()}; (LOBBY.conns||[]).forEach(c=>{try{if(c.open)c.send(msg);}catch(e){}}); if(isLobby())renderRoomList(); }
function flushReg(){ const r=LOBBY._reg; if(!r)return;
  if(LOBBY.role==='dir'){ upsertRoom({id:r.code,name:r.name,hasPass:r.hasPass,ts:Date.now()}); broadcastList(); }
  else if(LOBBY.conn&&LOBBY.conn.open){ try{LOBBY.conn.send({t:'reg',id:r.code,name:r.name,hasPass:r.hasPass});}catch(e){} } }
function dirRegister(code,name,hasPass){ LOBBY.rid=code; LOBBY._reg={code,name,hasPass:!!hasPass}; flushReg(); startDirPing(); }
function dirUnregister(){ const id=LOBBY.rid; LOBBY._reg=null; if(!id){stopDirPing();return;}
  if(LOBBY.role==='dir'){ removeRoom(id); broadcastList(); } else if(LOBBY.conn&&LOBBY.conn.open){ try{LOBBY.conn.send({t:'unreg',id});}catch(e){} }
  LOBBY.rid=null; stopDirPing(); }
function startDirPing(){ stopDirPing(); LOBBY.ping=setInterval(()=>{ const id=LOBBY.rid; if(!id)return; if(LOBBY.role==='dir')touchRoom(id); else if(LOBBY.conn&&LOBBY.conn.open){try{LOBBY.conn.send({t:'ping',id});}catch(e){}} },12000); }
function stopDirPing(){ if(LOBBY.ping){clearInterval(LOBBY.ping);LOBBY.ping=null;} }
function lobbyTeardown(){ stopDirPing(); try{if(LOBBY.conn)LOBBY.conn.close();}catch(e){} try{if(LOBBY.peer)LOBBY.peer.destroy();}catch(e){} LOBBY.peer=null;LOBBY.conn=null;LOBBY.role=null;LOBBY.conns=[];LOBBY.rooms=[];LOBBY.rid=null;LOBBY._reg=null; }
function leaveLobbyForGame(){ dirUnregister(); if(LOBBY.role!=='dir'){ lobbyTeardown(); } }

function dirOnConn(conn){ LOBBY.conns.push(conn);
  conn.on('data',(m)=>{ if(!m)return;
    if(m.t==='reg'){ conn._rid=m.id; upsertRoom({id:m.id,name:m.name,hasPass:!!m.hasPass,ts:Date.now()}); broadcastList(); }
    else if(m.t==='unreg'){ removeRoom(m.id); broadcastList(); }
    else if(m.t==='ping'){ touchRoom(m.id); }
    else if(m.t==='list?'){ try{conn.send({t:'list',rooms:activeRooms()});}catch(e){} }
  });
  conn.on('close',()=>{ if(conn._rid)removeRoom(conn._rid); LOBBY.conns=LOBBY.conns.filter(c=>c!==conn); broadcastList(); });
  conn.on('error',()=>{});
  conn.on('open',()=>{ try{conn.send({t:'list',rooms:activeRooms()});}catch(e){} });
}
function lobbyConnect(){
  if(!window.Peer){ renderRoomList(); return; }
  if(LOBBY.role){ renderRoomList(); refreshList(); return; }
  let claimed=false;
  let p; try{ p=new Peer(DIR_ID,{debug:1}); }catch(e){ becomeClient(); return; }
  LOBBY.peer=p;
  p.on('open',()=>{ claimed=true; LOBBY.role='dir'; LOBBY.conns=[]; p.on('connection',dirOnConn); flushReg(); renderRoomList(); });
  p.on('error',()=>{ if(!claimed){ try{p.destroy();}catch(_){} becomeClient(); } });
}
function becomeClient(){
  let pc; try{ pc=new Peer({debug:1}); }catch(e){ if(isLobby())renderRoomList(); return; }
  LOBBY.peer=pc; LOBBY.role='client';
  pc.on('open',()=>{ let c; try{ c=pc.connect(DIR_ID,{reliable:true}); }catch(e){ return; } LOBBY.conn=c;
    c.on('open',()=>{ try{c.send({t:'list?'});}catch(e){} flushReg(); });
    c.on('data',(m)=>{ if(m&&m.t==='list'){ LOBBY.rooms=m.rooms||[]; if(isLobby())renderRoomList(); } });
    c.on('close',()=>{ LOBBY.role=null; LOBBY.conn=null; setTimeout(()=>{ if(isLobby())lobbyConnect(); },800); });
    c.on('error',()=>{});
  });
  pc.on('error',()=>{ if(isLobby())renderRoomList(); });
}
function refreshList(){ try{ if(LOBBY.role==='client'&&LOBBY.conn&&LOBBY.conn.open)LOBBY.conn.send({t:'list?'}); else if(LOBBY.role==='dir')renderRoomList(); }catch(e){} }
function renderRoomList(){
  if(!isLobby())return;
  const rooms=activeRooms();
  const items=rooms.length? rooms.map(r=>`
    <div class="room-card">
      <div class="room-ico">${r.hasPass?'🔒':'🔓'}</div>
      <div class="room-info"><div class="room-name">${esc(r.name||r.id)}</div>
        <div class="room-sub">código <b>${esc(r.id)}</b> · ${r.hasPass?'con contraseña':'abierta'}</div></div>
      <button class="btn primary sm" onclick="joinRoomFromList('${esc(r.id)}',${r.hasPass?1:0})">Unirse</button>
    </div>`).join('')
    : `<div class="market-status" style="padding:18px 0">${LOBBY.role?'No hay salas abiertas ahora mismo. ¡Crea una!':'Buscando salas…'}</div>`;
  $('s-lobby').innerHTML=`<div class="setup-box">
     <h2>Salas online</h2>
     <div class="note-box">Crea tu propia sala (con nombre y, si quieres, contraseña) o únete a una de la lista. ${LOBBY.role?'':'<i>Conectando…</i>'}
       <br><span style="color:#9a90ad;font-size:12.5px">Función experimental P2P: la lista depende de que haya jugadores conectados; si no ves una sala, usa su código.</span></div>
     <div class="row-btns" style="margin-bottom:14px">
       <button class="btn primary" onclick="renderLobby('host')">＋ Crear sala</button>
       <button class="btn" onclick="renderLobby('join')">Unirse por código</button>
       <button class="btn" onclick="refreshList()">↻ Actualizar</button>
       <button class="btn" onclick="goSetup()">Atrás</button>
     </div>
     <div class="room-list">${items}</div>
   </div>`;
}
function joinRoomFromList(code,hasPass){
  modal(`<h3>Unirse a la sala</h3>
    <div class="ig"><label>Tu nombre</label><input id="jlname" maxlength="16" placeholder="Tu nombre"></div>
    ${hasPass?'<div class="ig"><label>Contraseña</label><input id="jlpass" type="password" placeholder="contraseña"></div>':''}
    <div class="row-btns"><button class="btn" onclick="closeModal()">Cancelar</button>

function doJoinFromList(code,hasPass){ const name=(($('jlname')&&$('jlname').value)||'').trim()||'Jugador'; const pass=(hasPass&&$('jlpass'))?($('jlpass').value||''):''; closeModal(); clientJoin(code,pass,name); }

/* ===================== SNAPSHOT (host -> client) ===================== */
let _fxQueue=[];
function pushFx(ev){ _fxQueue.push(ev); }
function snapshot(screen){
  const snap={ t:'snap', screen,
    G:{ names:G.names, coins:G.coins, equipCoins:G.equipCoins, bonus:G.bonus,
        eqReady:G.eqReady, team:G.team, spellbook:G.spellbook, items:G.items,
        curType:G.curType, aIndex:G.aIndex, cands:G.cands, phaseResult:G.phaseResult, phaseNeeds:G.phaseNeeds, subRound:G.subRound,
        bidsIn:{p:!!G.bids.p,o:!!G.bids.o} },
    B:null, pending:null, fx:_fxQueue.slice(), result:G._result||null };
  if(B){ snap.B={round:B.round,qi:B.qi,queue:B.queue,over:B.over,current:B.current,log:B.log};
         snap.pending=B.pending?{prompt:B.pending.prompt,validSide:B.pending.validSide,allowDead:B.pending.allowDead}:null; }
  _fxQueue=[];
  return snap;
}
function netSync(screen){ if(NET.role==='host') netSend(snapshot(screen)); else _fxQueue=[]; }
function applySnapshot(snap){
  const g=snap.G;
  G.names=g.names; G.coins=g.coins; G.equipCoins=g.equipCoins; G.bonus=g.bonus;
  G.eqReady=g.eqReady; G.team=g.team; G.spellbook=g.spellbook; G.items=g.items;
  G.curType=g.curType; G.aIndex=g.aIndex; G.cands=g.cands; G.bidsIn=g.bidsIn; G.phaseResult=g.phaseResult; G.phaseNeeds=g.phaseNeeds; G.subRound=g.subRound;
  if(snap.B){ B=snap.B; B.pending=snap.pending; } else { B=null; }
  show(snap.screen);
  if(snap.screen==='s-recruit') renderRecruit(NET.mySide);
  else if(snap.screen==='s-equip') renderEquip(NET.mySide);
  else if(snap.screen==='s-battle') renderBattle();
  else if(snap.screen==='s-result' && snap.result) showResult(snap.result.pWin===(NET.mySide==='p'));
  if(snap.fx&&snap.fx.length) flushFx(snap.fx);
}

/* ===================== INICIO DE PARTIDA ===================== */
function initGame(p1,p2,oppHuman){
  G.oppHuman=oppHuman; G.demo=false; coachHide();
  G.names={p:p1,o:(oppHuman?p2:'IA Némesis')};
  G.coins={p:START_COINS,o:START_COINS};
  G.equipReserve={p:0,o:0}; G.equipCoins={p:0,o:0};
  G.team={p:[],o:[]}; G.spellbook={p:[],o:[]}; G.items={p:[],o:[]};
  G.eqReady={p:false,o:false}; G.bonus={p:null,o:null}; G.pendDebt={p:0,o:0};
  G.pools={CC:shuffle(HEROES.filter(h=>h.type==='CC')),
           AD:shuffle(HEROES.filter(h=>h.type==='AD')),
           HE:shuffle(HEROES.filter(h=>h.type==='HE'))};
  G.aIndex=0; G.bids={p:null,o:null}; G._gameOver=false; G._result=null;
  show('s-recruit'); startAuctionPhase();
}
function applyBonus(side,b){
  if(G.pendDebt[side]){ G.coins[side]=Math.max(0,G.coins[side]-G.pendDebt[side]); G.pendDebt[side]=0; }
  if(b.type==='BON'){ G.coins[side]+=b.effect; if(b.id==='pre')G.pendDebt[side]=8; }
  else if(b.type==='EQP'){ G.equipReserve[side]+=b.effect; }
  else if(b.type==='RES'){ G.coins[other(side)]=Math.max(0,G.coins[other(side)]-b.effect); }
}

/* ===================== SUBASTA (un bonus nuevo por ronda) ===================== */
const SELL_RATE=0.6; // al vender un héroe recuperas el 60% (pierdes el 40%)
function startAuctionPhase(){
  G.phaseResult=null;
  G.curType=['CC','AD','HE'][G.aIndex];
  G.phaseNeeds={p:true,o:true}; G.subRound=0;
  G.bonus={p:pick(BONUS),o:pick(BONUS)};          // un bonificador por jugador y por RONDA de subasta
  applyBonus('p',G.bonus.p); applyBonus('o',G.bonus.o);
  beginBidRound();
}
function heroScore(h){const k=primKey(h.type);return h[k]*2+Math.round(h.hp/4)+Math.round(h.cost/2);}
function drawBalancedTrio(pool,n){
  n=Math.min(n,pool.length);
  if(pool.length<=n) return shuffle(pool.slice(0,n));
  const sorted=pool.slice().sort((a,b)=>heroScore(a)-heroScore(b));
  let wins=[]; for(let i=0;i+n<=sorted.length;i++) wins.push({i,sp:heroScore(sorted[i+n-1])-heroScore(sorted[i])});
  wins.sort((a,b)=>a.sp-b.sp); const top=wins.slice(0,Math.min(3,wins.length)); const start=top[rnd(top.length)].i;
  return shuffle(sorted.slice(start,start+n));   // terna equilibrada: stats parecidos, sin objetivo obvio
}
function beginBidRound(){
  G.cands=drawRaceSlate(G.pools[G.curType]);
  G.bids={p:null,o:null}; G.bidsIn={p:false,o:false};
  if(NET.role==='client') return;
  renderRecruit('p'); netSync('s-recruit');
}
function phaseHeroOf(side){ const t=G.team[side]; return t&&t.length?t[t.length-1]:null; }
function typeLong(t){return t==='CC'?'Cuerpo a Cuerpo':t==='AD'?'Ataque a Distancia':'Magia';}
function roleLabel(t){return t==='CC'?'Cuerpo a Cuerpo':t==='AD'?'Ataque a Distancia':'Hechicero';}
function roleIcon(t){return t==='CC'?'🗡️':t==='AD'?'🏹':'🔮';}
function typePB(t){return t==='CC'?'pb-cc':t==='AD'?'pb-ad':'pb-he';}
function primKey(t){return t==='CC'?'cc':t==='AD'?'ad':'he';}
function heroEmoji(h){const m={Guerreros:'⚔️',Druidas:'🌿','No-muertos':'💀',Vaqueros:'🤠',Elfos:'🏹',Magos:'🔮','Épicas':'✨',Cotidianos:'🎮'};return m[h.clan]||'🛡️';}
function bonusChipClass(t){return t==='BON'?'chip-bon':t==='EQP'?'chip-eqp':'chip-res';}

function recruitResultPanel(forSide){
  const r=G.phaseResult, cur=G.curType;
  const line=(side,pass,name,amt,got,isWin)=>`<div class="pr-row ${side===forSide?'pr-you':''}">
     <div class="pr-name">${esc(G.names[side])}${side===forSide?' · TÚ':(online()?' · rival':'')}</div>
     <div class="pr-bid">${pass?'<i>conserva su héroe y pasa</i>':`pujó <b class="pr-amt">${amt}</b> 🪙 por <b>${esc(name)}</b>`}</div>
     <div class="pr-got">${got?`obtiene: <b style="color:var(--gold)">${esc(got)}</b>`:'<i style="color:#ffaa66">aún sin héroe</i>'}${isWin?' <span class="pr-win">★ ganó la puja</span>':''}</div></div>`;
  let verdict;
  if(r.contested){ const w=r.winner; verdict=`Empate en <b>${esc(r.contestName)}</b>: gana <b style="color:var(--gold)">${esc(G.names[w])}</b>. ${r.needMore?'Se abre una <b>nueva terna</b> para que el otro jugador puje (quien ya tiene héroe puede venderlo para volver a pujar).':''}`; }
  else verdict = r.needMore ? 'Continúa la puja para completar la fase.' : 'Fase completada: cada jugador tiene su héroe.';
  const action = NET.role==='client'
     ? `<div class="market-status">Esperando al anfitrión…</div><div class="spinner"></div>`
     : (r.needMore
        ? `<button class="btn primary big" onclick="advancePhase()">Nueva terna / re-puja ▶</button>`
        : `<button class="btn primary big" onclick="advancePhase()">${r.phase>=2?'Ir al equipamiento ▶':'Siguiente fase de subasta ▶'}</button>`);
  return `<div class="r-header"><div><div class="r-title">Resultado de la puja</div>
       <div class="r-subtitle">Fase ${r.phase+1}/3${r.sub>0?` · re-puja ${r.sub}`:''} · ${typeLong(cur)}</div></div>
       <div class="phase-badge ${typePB(cur)}">${typeLong(cur)}</div></div>
     <div class="pr-box">
       ${line('p',r.pPass,r.bpName,r.bpAmt,r.gotP,r.contested&&r.winner==='p')}
       ${line('o',r.oPass,r.boName,r.boAmt,r.gotO,r.contested&&r.winner==='o')}
       <div class="pr-verdict">${verdict}</div></div>
     <div style="text-align:center;margin-top:18px">${action}</div>`;
}
function renderRecruit(forSide){
  if(G.phaseResult){ $('s-recruit').innerHTML=recruitResultPanel(forSide); return; }
  const t=G.curType, k=primKey(t);
  const need=G.phaseNeeds?G.phaseNeeds[forSide]:true;
  const head=`<div class="r-header">
     <div><div class="r-title">Subasta de Héroes</div>
       <div class="r-subtitle">Fase ${G.aIndex+1}/3${G.subRound>0?' · re-puja '+G.subRound:''} · ${roleIcon(t)} ${typeLong(t)} · el sobrante pasa al Equipamiento</div></div>
     <div class="phase-badge ${typePB(t)}">${roleIcon(t)} ${typeLong(t)}</div></div>`;
  const bidsIn=G.bidsIn||{};
  const statusLine=(side)=>{ const ph=G.phaseNeeds?G.phaseNeeds[side]:true;
    if(bidsIn[side]) return '<div class="bid-done">✓ decisión enviada</div>';
    if(!ph) return '<div class="bid-done" style="color:#9fd0ff">✓ ya tiene héroe</div>';
    return '<div class="bid-wait">…decidiendo</div>'; };
  const panel=(side)=>{
    const b=G.bonus[side]||{name:'—',type:'BON',txt:''};
    const acq=(G.team[side]||[]).map(h=>heroMini(h)).join('')||'<div class="slot-empty">sin héroes aún</div>';
    const youTag=side===forSide?' · TÚ':(online()?' · rival':'');
    return `<div class="side-panel ${side===forSide?'side-you':''}">
      <div class="side-name">${esc(G.names[side])}${youTag}</div>
      <div class="coins-row"><div class="coins-num">${G.coins[side]}</div><div class="coins-lbl">monedas<br>subasta</div></div>
      <div class="hand-lbl">Bonificador de esta ronda</div>
      <span class="chip ${bonusChipClass(b.type)}">${esc(b.name)}</span>
      <div class="note-box" style="margin:6px 0 8px">${esc(b.txt)}</div>
      ${statusLine(side)}
      <div class="hand-lbl">Héroes</div>${acq}</div>`;
  };
  let center;
  if(bidsIn[forSide]){
    center=`<div class="market-area"><div class="market-status">Tu decisión está enviada. ${online()?'Esperando al rival…':'Resolviendo…'}</div><div class="spinner"></div></div>`;
  } else if(!need){
    const h=phaseHeroOf(forSide); const refund=Math.floor(((h&&h.boughtFor)||0)*SELL_RATE);
    const preview=G.cands.map(x=>recruitCard(x,forSide,k,'preview')).join('');
    center=`<div class="market-area">
       <div class="market-status">Ya tienes a <b style="color:var(--gold)">${esc(h?h.name:'—')}</b>. Aquí está la <b>nueva tanda</b>: si te interesa alguno, <b>vende</b> tu héroe para entrar a pujar.</div>
       <div class="rebid-box">
         <div class="rebid-hero">${heroEmoji(h)} ${esc(h?h.name:'')} <span class="rebid-meta">pagaste ${(h&&h.boughtFor)||0} 🪙</span></div>
         <p class="rebid-tip">Vender recupera ${refund} 🪙 (pierdes el ${Math.round((1-SELL_RATE)*100)}%) y te deja pujar por uno de estos héroes.</p>
         <div class="row-btns">
           <button class="btn" onclick="passBid('${forSide}')">Conservar y pasar</button>
           <button class="btn primary" onclick="sellHero('${forSide}')">Vender y pujar</button>
         </div></div>
       <div class="cards-grid">${preview}</div></div>`;
  } else {
    const cards=G.cands.map(h=>recruitCard(h,forSide,k)).join('');
    const reb=(G.subRound>0)?'<b style="color:#ffcf57">Re-puja por empate.</b> ':'';
    center=`<div class="market-area"><div class="market-status">${reb}Elige <b>un</b> héroe y haz tu puja sellada (máx. ${G.coins[forSide]}).</div>
       <div class="cards-grid">${cards}</div></div>`;
  }
  $('s-recruit').innerHTML=head+`<div class="r-layout">${panel('p')}${center}${panel('o')}</div>`;
}
function heroMini(h){
  return `<div class="hero-acquired" onclick="heroInfo('${h.id}')">
    <div class="ha-name">${esc(h.name)}</div>
    <div class="ha-stats"><span class="sp sp-cc">CC ${h.cc}</span><span class="sp sp-ad">AD ${h.ad}</span>
      <span class="sp sp-he">HE ${h.he}</span><span class="sp sp-hp">HP ${h.hp}</span></div></div>`;
}
/* numeración de cartas (Base Set) */
let CARD_NO=null;
function buildCardNo(){ CARD_NO={}; let i=0; const add=a=>a.forEach(x=>{i++;CARD_NO[x.id]=String(i).padStart(3,'0');}); add(HEROES);add(SPELLS);add(MELEE);add(RANGED);add(ARMORS);add(OBJECTS);add(BONUS); }
function cardNo(id){ if(!CARD_NO)buildCardNo(); return CARD_NO[id]||'000'; }
function clanSymbol(clan){ return (typeof CLAN_SYMBOL!=='undefined'&&CLAN_SYMBOL[clan])||'🛡️'; }
function bfLogo(){ return '<span class="bf-mono">BF</span>'; }
function bfTag(id){ return `<div class="bf-tag">${bfLogo()}<span class="bf-tag-txt">Base Set · Bizarre Fantasies · Nº ${cardNo(id)}</span></div>`; }
function drawRaceSlate(pool){
  const by={}; for(const h of pool){ (by[h.clan]=by[h.clan]||[]).push(h); }
  const out=[]; for(const c of Object.keys(by)) out.push(pick(by[c]));   // un héroe de cada raza disponible
  return shuffle(out);
}
function cardFace(h,variant){
  const elite=variant==='elite';
  const cc=elite?h.eCc:h.cc, ad=elite?h.eAd:h.ad, he=elite?h.eHe:h.he, hp=elite?h.eHp:h.hp;
  const col=h.clanColor, sym=clanSymbol(h.clan);
  const ability=elite?h.eAbility:h.ability, abilityTxt=elite?h.eTxt:h.abilityTxt;
  return `<div class="cardface ${elite?'cf-elite':''}" style="--clan:${col}">
     <div class="cf-band" style="background:${col}"><span class="cf-sym">${sym}</span><span class="cf-race">${esc(h.clan)}${elite?' ÉLITE':''}</span></div>
     <div class="cf-coin"><span>${h.cost}</span></div>
     <div class="cf-art">
        <div class="cf-art-emoji">${heroEmoji(h)}</div>
        <div class="cf-name">${esc(h.name)}${elite?' ★':''}</div>
        <div class="cf-title">${esc(h.title)}</div>
        <div class="cf-heart"><span class="cf-heart-ico">❤</span><span class="cf-hp">${hp}</span></div>
        <div class="cf-stats">
          <div class="cf-stat cf-cc"><span>CC</span><b>${cc}</b></div>
          <div class="cf-stat cf-ad"><span>AD</span><b>${ad}</b></div>
          <div class="cf-stat cf-he"><span>HE</span><b>${he}</b></div></div>
     </div>
     <div class="cf-foot">
        <div class="cf-ability"><b>[${elite?'ÉLITE':'HAB'}] ${esc(ability)}</b> · ${esc(abilityTxt)}</div>
        ${bfTag(h.id)}</div>
   </div>`;
}
function flipCard(key){ const el=$('flip_'+key); if(el)el.classList.toggle('flipped'); }
function zoomCard(id){
  let h=byId(HEROES,id); if(!h){ for(const sd of ['p','o']){ const f=byId(G.team[sd]||[],id); if(f){h=f;break;} } }
  if(!h)return;
  modal(`<h3>${heroEmoji(h)} ${esc(h.name)}</h3>
    <div class="zoom-card">
      <div class="flip3d zoom-flip" id="zoomflip"><div class="flip3d-inner">
        <div class="face front">${cardFace(h,'normal')}</div><div class="face back">${cardFace(h,'elite')}</div></div></div>
      <div style="text-align:center;margin-top:12px"><button class="btn primary" onclick="document.getElementById('zoomflip').classList.toggle('flipped')">⟳ Ver Normal / Élite</button></div>
    </div>`);
}
function recruitCard(h,side,k,mode){
  mode=mode||'bid';
  const bid = mode==='bid'
    ? `<div class="hcard-bid-zone"><input class="bid-mini-input" id="bid_${h.id}" type="number" min="0" max="${G.coins[side]}" value="${Math.min(h.cost,G.coins[side])}"><button class="btn-bid-card" onclick="submitBid('${side}','${h.id}')">Pujar</button></div>`
    : `<div class="hcard-preview-note">🔒 vende tu héroe para pujar</div>`;
  return `<div class="card-wrap">
    <div class="flip3d" id="flip_${side}_${h.id}"><div class="flip3d-inner">
       <div class="face front">${cardFace(h,'normal')}</div>
       <div class="face back">${cardFace(h,'elite')}</div></div></div>
    <div class="card-ctl">
       <button class="card-ctl-btn" onclick="zoomCard('${h.id}')">🔍 Ampliar</button>
       <button class="card-ctl-btn" onclick="flipCard('${side}_${h.id}')">⟳ Élite</button></div>
    ${bid}
  </div>`;
}
function submitBid(side,heroId){
  if(G.demoExample)return;
  if(NET.role==='client'){ const inp=$('bid_'+heroId); let amt=clamp(parseInt(inp.value||'0',10)||0,0,G.coins[side]); sendIntent('bid',{heroId,amount:amt}); G.bidsIn=Object.assign({},G.bidsIn,{[side]:true}); renderRecruit(NET.mySide); return; }
  const inp=$('bid_'+heroId); let amt=clamp(parseInt(inp.value||'0',10)||0,0,G.coins[side]);
  G.bids[side]={heroId,amount:amt}; G.bidsIn[side]=true; afterLocalDecision(side);
}
function passBid(side){
  if(G.demoExample)return;
  if(NET.role==='client'){ sendIntent('pass',{}); G.bidsIn=Object.assign({},G.bidsIn,{[side]:true}); renderRecruit(NET.mySide); return; }
  G.bids[side]={pass:true}; G.bidsIn[side]=true; afterLocalDecision(side);
}
function sellHero(side){
  if(G.demoExample)return;
  if(NET.role==='client'){ sendIntent('sell',{}); return; }
  if(G.phaseNeeds[side]) return; const h=phaseHeroOf(side); if(!h) return;
  const refund=Math.floor((h.boughtFor||0)*SELL_RATE);
  G.coins[side]+=refund; G.team[side].pop(); G.phaseNeeds[side]=true;
  notif(`${G.names[side]} vende a ${h.name} (+${refund} 🪙)`);
  if(online()){ renderRecruit(NET.mySide); netSync('s-recruit'); } else { renderRecruit(side); }
}
function afterLocalDecision(side){
  if(side==='p'){
    if(online()){ renderRecruit('p'); netSync('s-recruit'); if(G.bidsIn.o) tryResolveRound(); }
    else if(G.oppHuman){ handoff(G.names.o,'Decisión secreta',()=>{ show('s-recruit'); renderRecruit('o'); }); }
    else { aiDecision('o'); tryResolveRound(); }
  } else { tryResolveRound(); }
}
function netBid(heroId,amount){ if(G.phaseNeeds && !G.phaseNeeds.o)return; G.bids.o={heroId,amount:clamp(amount|0,0,G.coins.o)}; G.bidsIn.o=true; renderRecruit('p'); netSync('s-recruit'); if(G.bidsIn.p) tryResolveRound(); }
function netPass(){ G.bids.o={pass:true}; G.bidsIn.o=true; renderRecruit('p'); netSync('s-recruit'); if(G.bidsIn.p) tryResolveRound(); }
function netSell(){ if(G.phaseNeeds.o)return; const h=phaseHeroOf('o'); if(!h)return; const refund=Math.floor((h.boughtFor||0)*SELL_RATE); G.coins.o+=refund; G.team.o.pop(); G.phaseNeeds.o=true; renderRecruit('p'); netSync('s-recruit'); }
function aiBid(side){
  const budget=G.coins[side], opp=other(side);
  let ranked=G.cands.map(h=>({h,v:heroScore(h)})).sort((a,b)=>b.v-a.v);
  let target=ranked.find(r=>Math.round(r.v*0.35)<=budget)||ranked[ranked.length-1];
  let bid=clamp(Math.round(target.v*0.35)+rnd(8),0,budget);
  if(G.bids[opp] && !G.bids[opp].pass && G.bids[opp].heroId===target.h.id){ const need=G.bids[opp].amount+1; if(need<=budget && Math.random()<0.7) bid=Math.min(budget,Math.max(bid,need+rnd(5))); }
  G.bids[side]={heroId:target.h.id,amount:bid}; G.bidsIn[side]=true;
}
function aiDecision(side){ if(G.phaseNeeds[side]) aiBid(side); else { G.bids[side]={pass:true}; G.bidsIn[side]=true; } }
function nameOf(h){ return h?h.name:'—'; }
function tryResolveRound(){ if(NET.role==='client')return; if(!G.bidsIn.p||!G.bidsIn.o)return; resolveBidRound(); }
function resolveBidRound(){
  const bp=G.bids.p, bo=G.bids.o; const pBid=bp&&!bp.pass, oBid=bo&&!bo.pass;
  let contested=false, winner=null, contestId=null;
  if(pBid && oBid && bp.heroId===bo.heroId){
    contested=true; contestId=bp.heroId; winner=(bp.amount>=bo.amount)?'p':'o';
    award(winner,contestId, winner==='p'?bp.amount:bo.amount); G.phaseNeeds[winner]=false; G.phaseNeeds[other(winner)]=true;
  } else {
    if(pBid){ award('p',bp.heroId,bp.amount); G.phaseNeeds.p=false; }
    if(oBid){ award('o',bo.heroId,bo.amount); G.phaseNeeds.o=false; }
  }
  G.phaseResult={ phase:G.aIndex, sub:G.subRound, contested, winner,
    contestName: contested?((byId(G.cands,contestId)||{}).name)||'—':'',
    pPass:!pBid, oPass:!oBid,
    bpName: pBid?(((byId(G.cands,bp.heroId)||{}).name)||'—'):'', boName: oBid?(((byId(G.cands,bo.heroId)||{}).name)||'—'):'',
    bpAmt: pBid?bp.amount:0, boAmt: oBid?bo.amount:0,
    gotP: G.phaseNeeds.p?null:nameOf(phaseHeroOf('p')), gotO: G.phaseNeeds.o?null:nameOf(phaseHeroOf('o')),
    needMore: (G.phaseNeeds.p||G.phaseNeeds.o) };
  show('s-recruit'); renderRecruit('p'); netSync('s-recruit');
}
function advancePhase(){
  if(NET.role==='client') return;
  const needMore=G.phaseNeeds.p||G.phaseNeeds.o; G.phaseResult=null;
  if(needMore){ G.subRound++; beginBidRound(); }
  else { G.aIndex++; if(G.aIndex<3) startAuctionPhase(); else finishAuction(); }
}
function award(side,heroId,amount){
  const tmpl=byId(G.cands,heroId)||byId(HEROES,heroId);
  G.coins[side]=Math.max(0,G.coins[side]-amount);
  const inst=makeInstance(tmpl); inst.boughtFor=amount; G.team[side].push(inst);
  for(const t of ['CC','AD','HE']) G.pools[t]=G.pools[t].filter(x=>x.id!==heroId);
}
function makeInstance(t){ const h=deep(t); h.mwep=null; h.rwep=null; h.armor=null; return h; }
function finishAuction(){
  const eqPool=BONUS.filter(b=>b.type==='EQP');
  for(const s of ['p','o']){ const eb=pick(eqPool); G.equipReserve[s]+=eb.effect; G.bonus[s]=eb; G.equipCoins[s]=G.coins[s]+EQUIP_BASE+G.equipReserve[s]; }

}

function eqVelVal(h){ const pr=prof(h); let v=eqStat(h,primKey(h.type))+(pr.mVel||0); if(h.mwep&&h.mwep.tag==='+veloc')v+=3; if(h.rwep&&h.rwep.tag==='lento')v-=2; return Math.max(1,v); }

function aiEquip(side){
  let budget=G.equipCoins[side];
  const buyW=(h,arr,kindKey)=>{const aff=arr.filter(w=>w.cost<=budget).sort((a,b)=>b.cost-a.cost);if(aff.length){const w=aff[0];budget-=w.cost;h[kindKey]=deep(w);}};
  for(const h of G.team[side]){
    if(h.type==='AD') buyW(h,RANGED,'rwep');
    else if(h.type==='CC') buyW(h,MELEE,'mwep');
    else { const cheap=RANGED.filter(w=>w.cost<=budget).sort((a,b)=>a.cost-b.cost); if(cheap.length){budget-=cheap[0].cost;h.rwep=deep(cheap[0]);} }
  }
  const tank=[...G.team[side]].sort((a,b)=>b.hp-a.hp)[0];
  const arm=ARMORS.filter(a=>a.cost<=budget).sort((a,b)=>(b.hp+b.redM+b.redH)-(a.hp+a.redM+a.redH))[0]; if(tank&&arm){budget-=arm.cost;tank.armor=deep(arm);}
  const mage=G.team[side].find(h=>h.type==='HE');
  if(mage){ for(const s of shuffle(SPELLS)){ if(s.cost<=budget){budget-=s.cost;G.spellbook[side].push(s.id);} if(G.spellbook[side].length>=4)break; } }
  const shop=(mage?['ob_mana','ob_pot','ob_revive','ob_shield','ob_bomb']:['ob_pot','ob_revive','ob_shield','ob_bomb']);
  for(const oid of shop){ const o=byId(OBJECTS,oid); if(o&&o.cost<=budget){budget-=o.cost;G.items[side].push(deep(o));} }
  G.equipCoins[side]=budget;
}

/* ===================== BATALLA ===================== */
let B=null;
function humanCtl(side){
  if(G.demo) return false;
  if(NET.role==='host') return side==='p';
  if(NET.role==='client') return side===NET.mySide;
  return side==='p' || (side==='o'&&G.oppHuman);
}
function aiCtl(side){ if(G.demo) return true; if(online())return false; if(G.oppHuman)return false; return side==='o'; }
function startBattle(){
  for(const side of ['p','o']) for(const h of G.team[side]) battlePrep(h);
  B={round:0,queue:[],qi:0,over:false,current:null,log:[],wd:null,seq:0,pending:null};
  show('s-battle'); pushLog('lx','¡Comienza la batalla!');
  if(G.demo) coach('🧙 Observa: los héroes actúan por turnos. Te iré explicando lo importante.');
  renderBattle(); netSync('s-battle');
  if(NET.role!=='client') setTimeout(nextRound,600);
}
function battlePrep(h){
  const pr=prof(h);
  h.maxHp=h.hp+(h.armor?h.armor.hp:0); h.hp=h.maxHp;
  h.alive=true; h.eliteMode=false; h.eliteUsed=false; h.abilityUsed=false;
  h._mods=[]; h.shield=0; h.defending=false;
  h.sleep=0; h.para=0; h.skip=0; h.silence=0; h.evade=0; h.mark=null; h.wardVal=0; h.wardTurns=0;
  h.maxMana=Math.max(0,(MANA_BASE[h.type]||0)+(pr.manaBonus||0)); h.mana=h.maxMana;
  h.manaRegen=0;   // el maná NO se regenera: es una reserva para toda la batalla
  h.velMod=(pr.mVel||0);
  if(h.mwep&&h.mwep.tag==='+veloc')h.velMod+=3;
  if(h.rwep&&h.rwep.tag==='lento')h.velMod-=2;
}
function getHero(side,id){return byId(G.team[side],id);}
function living(side){return (G.team[side]||[]).filter(h=>h.alive);}
function baseStat(h,k){return h.eliteMode?h['e'+cap(k)]:h[k];}
function stat(h,k){
  const pr=prof(h); let v=baseStat(h,k);
  for(const m of h._mods) v+=(m[k]||0);
  if(k==='cc'){ v+=(pr.mMelee||0); if(h.mwep) v+=h.mwep.cc; }
  if(k==='ad') v+=(pr.mRanged||0);
  if(k==='he') v+=(pr.mSpell||0);
  return Math.max(0,v);
}
function velocity(h){ let v=stat(h,primKey(h.type))+(h.velMod||0); for(const m of h._mods) v+=(m.vel||0); return Math.max(1,v); }
function typePrio(t){return t==='AD'?0:t==='HE'?1:2;}
function nextRound(){
  if(B.over||NET.role==='client')return;
  B.round++;
  let all=[]; for(const side of ['p','o']) for(const h of living(side)) all.push({side,id:h.id});
  all.sort((a,b)=>{const ha=getHero(a.side,a.id),hb=getHero(b.side,b.id);const pa=typePrio(ha.type),pb=typePrio(hb.type);if(pa!==pb)return pa-pb;return velocity(hb)-velocity(ha);});
  B.queue=all; B.qi=0; pushLog('lg','— Ronda '+B.round+' —');
  if(G.demo&&B.round===1) demoNote('order','Orden de turno: primero 🏹 Ataque a Distancia, luego 🔮 Magia, luego 🗡️ Cuerpo a Cuerpo (a igualdad, manda la velocidad).');
  renderBattle(); netSync('s-battle'); setTimeout(stepTurn,500);
}
function stepTurn(){
  clearWatchdog(); if(B.over||NET.role==='client')return;
  if(B.qi>=B.queue.length){ setTimeout(nextRound,400); return; }
  const slot=B.queue[B.qi], h=getHero(slot.side,slot.id);
  if(!h||!h.alive){ B.qi++; return stepTurn(); }
  B.current=slot;
  if(h.armor&&h.armor.regen&&h.hp<h.maxHp){ h.hp=Math.min(h.maxHp,h.hp+h.armor.regen); }
  if(h.sleep>0){ pushLog('li',`${h.name} duerme y pierde el turno.`); pushFx({k:'status',side:slot.side,id:h.id,txt:'😴'}); demoNote('status','💤 Estados como dormir o paralizar hacen perder el turno. Fíjate en el aura del héroe afectado.'); h.sleep--; renderBattle(); netSync('s-battle'); return setTimeout(endTurn,900); }
  if(h.para>0){ pushLog('li',`${h.name} está paralizado.`); pushFx({k:'status',side:slot.side,id:h.id,txt:'⚡'}); demoNote('status','⚡ Estados como dormir o paralizar hacen perder el turno. Fíjate en el aura del héroe afectado.'); h.para--; renderBattle(); netSync('s-battle'); return setTimeout(endTurn,900); }
  if(h.skip>0){ pushLog('li',`${h.name} pierde el turno.`); pushFx({k:'status',side:slot.side,id:h.id,txt:'🚫'}); h.skip--; renderBattle(); netSync('s-battle'); return setTimeout(endTurn,900); }
  h.defending=false; renderBattle(); netSync('s-battle');
  if(humanCtl(slot.side)){ /* menú en renderBattle */ }
  else if(aiCtl(slot.side)){
    const go=()=>{ armWatchdog(); setTimeout(()=>{ try{ aiTurn(h,slot.side); }catch(e){ pushLog('ld','(IA pasa turno)'); endTurn(); } }, G.demo?700:750); };
    if(G.demo){ coach(`Turno de ${h.name} — ${roleIcon(h.type)} ${roleLabel(h.type)} (${h.hp}/${h.maxHp} HP${h.maxMana>0?' · '+h.mana+'/'+h.maxMana+' MP':''}). Pulsa para ver su acción.`); coachBtn('Siguiente turno ▶', go); }
    else { go(); }
  }
  else { /* humano remoto: el host espera la intención del cliente */ }
}
function tickAfter(h){
  h._mods=h._mods.map(m=>({...m,turns:m.turns-1})).filter(m=>m.turns>0);
  if(h.silence>0)h.silence--;
  if(h.wardTurns>0){ h.wardTurns--; if(h.wardTurns<=0)h.wardVal=0; }
  if(h.mark){ h.mark.turns--; if(h.mark.turns<=0)h.mark=null; }
}
function endTurn(){
  clearWatchdog(); if(B.over||NET.role==='client')return;
  const slot=B.current; if(slot){ const h=getHero(slot.side,slot.id); if(h) tickAfter(h); }
  B.current=null; B.qi++;
  if(checkWin())return;
  renderBattle(); netSync('s-battle'); setTimeout(stepTurn,400);
}
function armWatchdog(){ const mySeq=++B.seq, myQi=B.qi; B.wd=setTimeout(()=>{ if(!B.over && B.seq===mySeq && B.qi===myQi){ pushLog('ld','(turno forzado)'); endTurn(); } },4200); }
function clearWatchdog(){ if(B&&B.wd){clearTimeout(B.wd);B.wd=null;} }
function checkWin(){
  const pA=living('p').length, oA=living('o').length;
  if(pA===0||oA===0){
    B.over=true; clearWatchdog();
    const pWin=oA===0; G._result={pWin}; G._gameOver=true;
    if(NET.role==='host'){ netSync('s-battle'); netSend({t:'end',pWin}); }
    setTimeout(()=>showResult(NET.role==='client'?(pWin===(NET.mySide==='p')):pWin),800);
    return true;
  }
  return false;
}
function tSide(h){ return (G.team.p||[]).indexOf(h)>=0?'p':'o'; }

/* ---------- daño / curación / muerte (con elemental + maná + resistencias) ---------- */
function dealDamage(target,amount,opts){
  opts=opts||{}; const pr=prof(target);
  if(target.evade>0 && opts.type!=='true' && !opts.noEvade){ target.evade--; pushLog('li',`${target.name} esquiva.`); pushFx({k:'miss',side:tSide(target),id:target.id}); return 0; }
  if(opts.type==='spell' && opts.element && target.armor && target.armor.element && ELEM_COUNTER[target.armor.element]===opts.element){
    pushLog('lg',`La ${target.armor.name} de ${target.name} NIEGA el hechizo de ${opts.element}.`); pushFx({k:'negate',side:tSide(target),id:target.id}); return 0;
  }
  if(target.mark) amount+=target.mark.dmg;
  if(opts.type==='melee'){ if(!opts.ignoreArmor) amount-=(target.armor?target.armor.redM:0); amount-=(pr.resPhys||0); }
  else if(opts.type==='ranged'){ let r=target.armor?target.armor.redA:0; r=Math.round(r*(1-(opts.pierce||0))); amount-=r; amount-=(pr.resPhys||0); }
  else if(opts.type==='spell'){ amount-=(target.armor?target.armor.redH:0); amount-=(pr.resMagic||0); if(target.wardTurns>0) amount-=target.wardVal; }
  if(target.defending) amount=Math.round(amount*0.5);
  amount=Math.max(1,Math.round(amount));
  if(target.shield>0 && !opts.ignoreShield){ const ab=Math.min(target.shield,amount); target.shield-=ab; amount-=ab; if(target.shield<0)target.shield=0; }
  if(amount<=0){ pushFx({k:'block',side:tSide(target),id:target.id}); return 0; }
  target.hp-=amount; pushFx({k:'hit',side:tSide(target),id:target.id,dmg:amount,dtype:opts.type||'melee'});
  if(target.hp<=0) handleDeath(target);
  return amount;
}
function heal(target,amount){ if(!target.alive)return 0; amount=Math.max(0,Math.round(amount)); const b=target.hp; target.hp=Math.min(target.maxHp,target.hp+amount); const g=target.hp-b; if(g>0) pushFx({k:'heal',side:tSide(target),id:target.id,amt:g}); return g; }
function handleDeath(target){
  if(!target.eliteUsed){
    const pr=prof(target);
    target.eliteUsed=true; target.eliteMode=true; target.abilityUsed=false;
    target.maxHp=target.eHp+(target.armor?target.armor.hp:0);
    target.hp=Math.max(1,Math.round(target.maxHp*(pr.eliteHpPct||0.3)));
    target.shield=0; target.sleep=0; target.para=0; target.mana=target.maxMana;
    pushLog('lx',`¡${target.name} renace ÉLITE (${Math.round((pr.eliteHpPct||0.3)*100)}% vida)! → ${target.eAbility}`);
    pushFx({k:'elite',side:tSide(target),id:target.id}); target._flipNow=true; setTimeout(()=>{ if(target)target._flipNow=false; },1000); demoNote('elite','⭐ Al caer, un héroe RENACE en forma ÉLITE: más poder y aura dorada. La segunda vez cae de verdad.');
  } else { target.alive=false; target.hp=0; pushLog('ld',`${target.name} ha caído.`); pushFx({k:'death',side:tSide(target),id:target.id}); }
}

function pendTarget(prompt,validSide,cb,opts){ opts=opts||{}; B.pending={prompt,validSide,cb,allowDead:!!opts.allowDead}; renderBattle(); netSync('s-battle'); }
function pickTarget(side,id){
  if(!B.pending||B.pending.validSide!==side)return;
  const h=getHero(side,id); if(!h)return;
  if(!B.pending.allowDead && !h.alive)return;
  if(B.pending.allowDead && h.alive)return;
  if(NET.role==='client'){ sendIntent('target',{side,id}); return; }
  const cb=B.pending.cb; B.pending=null; cb(h);
}
function cancelPending(){ if(NET.role==='client'){ sendIntent('cancel',{}); return;} B.pending=null; renderBattle(); netSync('s-battle'); }
function enemySide(side){return other(side);}

/* ---------- acciones del jugador ---------- */
function actMelee(){ if(NET.role==='client'){ sendIntent('melee',{}); return;} const side=B.current.side,h=getHero(side,B.current.id);
  pendTarget('Elige objetivo del golpe cuerpo a cuerpo',enemySide(side),(t)=>{ pushFx({k:'slash',toSide:tSide(t),toId:t.id}); const d=dealDamage(t,stat(h,'cc'),{type:'melee'}); pushLog('ld',`${h.name} golpea a ${t.name} (-${d}) cuerpo a cuerpo.`); finishAct(); }); }
function actRanged(){ if(NET.role==='client'){ sendIntent('ranged',{}); return;} const side=B.current.side,h=getHero(side,B.current.id); if(!h.rwep)return;
  pendTarget('Elige objetivo del disparo',enemySide(side),(t)=>{ rangedAttack(h,t,side); finishAct(); }); }
function rangedAttack(h,t,side){
  demoNote('ranged','🏹 Los de Ataque a Distancia disparan: el daño sube con su nivel de AD y con el arma equipada.');
  const w=h.rwep; let pierce=0; if(w.tag==='perfora')pierce=0.5; if(w.tag==='mágico')pierce=1;
  const per=Math.round(w.power*stat(h,'ad')/AD_REF);
  pushFx({k:'arrow',fromSide:side||tSide(h),fromId:h.id,toSide:tSide(t),toId:t.id,hits:(w.hits||1)});
  let total=0; for(let i=0;i<(w.hits||1);i++){ total+=dealDamage(t,per,{type:'ranged',pierce}); if(!t.alive)break; }
  pushLog('ld',`${h.name} dispara (${w.name}) a ${t.name} (-${total}).`);
}
function actSpellMenu(){
  const side=B.current.side, h=getHero(side,B.current.id);
  const rows=(G.spellbook[side]||[]).map(id=>{const s=byId(SPELLS,id); const ok=h.mana>=s.mana;
    return `<button class="btn pick-row ${ok?'':'pick-dis'}" ${ok?`onclick="closeModal();castSpell('${id}')"`:''}>
       <span>${esc(s.name)} <span class="el-tag el-${s.element}">${esc(s.element)}</span></span>
       <span class="pick-meta">maná ${s.mana} · ${esc(s.txt)}</span></button>`;}).join('');
  modal(`<h3>🔮 Lanzar hechizo</h3><div class="modal-note">Maná: ${h.mana}/${h.maxMana} · daño ×${(stat(h,'he')/HE_REF).toFixed(2)} según tu nivel de <b>Magia</b>.</div>${rows}`);
}
function castSpell(id){
  if(NET.role==='client'){ sendIntent('castSpell',{id}); return; }
  const side=B.current.side,h=getHero(side,B.current.id),s=byId(SPELLS,id);
  if(h.mana<s.mana){ notif('Maná insuficiente'); return; }
  h.mana-=s.mana;
  const mag=stat(h,'he')/HE_REF, val=Math.max(1,Math.round(s.base*mag)), el=s.element;
  const foes=enemySide(side), allies=side;
  const sh=(t)=>pushFx({k:'spell',toSide:tSide(t),toId:t.id,el});
  switch(s.kind){
    case 'dmg1': pendTarget('Objetivo del hechizo',foes,(t)=>{sh(t);const d=dealDamage(t,val,{type:'spell',element:el});pushLog('ld',`${h.name} lanza ${s.name} sobre ${t.name} (-${d}).`);finishAct();});return;
    case 'dmg1slow': pendTarget('Objetivo a congelar',foes,(t)=>{sh(t);const d=dealDamage(t,val,{type:'spell',element:el});t._mods.push({vel:-4,turns:2});pushLog('ld',`${h.name} congela a ${t.name} (-${d}).`);finishAct();});return;
    case 'dmg2':{living(foes).slice(0,2).forEach(t=>{sh(t);const d=dealDamage(t,val,{type:'spell',element:el});pushLog('ld',`${s.name} → ${t.name} (-${d}).`);});pushLog('li',`${h.name} lanza ${s.name}.`);finishAct();return;}
    case 'dmgAll':{living(foes).forEach(t=>{sh(t);const d=dealDamage(t,val,{type:'spell',element:el});pushLog('ld',`${s.name} → ${t.name} (-${d}).`);});pushLog('li',`${h.name} desata ${s.name}.`);finishAct();return;}
    case 'heal1': pendTarget('Aliado a curar',allies,(t)=>{const g=heal(t,val);pushLog('lh',`${h.name} cura a ${t.name} (+${g}).`);finishAct();});return;
    case 'healAll':{living(allies).forEach(t=>{const g=heal(t,val);if(g)pushLog('lh',`${t.name} +${g}.`);});pushLog('lh',`${h.name} lanza ${s.name}.`);finishAct();return;}
    case 'shield': pendTarget('Aliado a proteger',allies,(t)=>{t.shield+=val;pushFx({k:'shieldup',toSide:tSide(t),toId:t.id});pushLog('lg',`${h.name} da escudo de ${val} a ${t.name}.`);finishAct();});return;
    case 'ward': pendTarget('Aliado a proteger de hechizos',allies,(t)=>{t.wardVal=val;t.wardTurns=2;pushFx({k:'wardup',toSide:tSide(t),toId:t.id});pushLog('lg',`${h.name} protege a ${t.name} del daño mágico (-${val}, 2 turnos).`);finishAct();});return;
    case 'sleep': pendTarget('Objetivo a dormir',foes,(t)=>{const p=clamp(0.35+stat(h,'he')/40,0.1,0.95);if(Math.random()<p){t.sleep=h.eliteMode?2:1;pushFx({k:'status',side:tSide(t),id:t.id,txt:'😴'});pushLog('li',`${h.name} duerme a ${t.name}.`);}else pushLog('li',`${h.name} falla el sueño.`);finishAct();});return;
    case 'para': pendTarget('Objetivo a paralizar',foes,(t)=>{const p=clamp(0.3+stat(h,'he')/40,0.1,0.9);if(Math.random()<p){t.para=1;pushFx({k:'status',side:tSide(t),id:t.id,txt:'⚡'});pushLog('li',`${h.name} paraliza a ${t.name}.`);}else pushLog('li',`${h.name} falla la parálisis.`);finishAct();});return;
    case 'debuff': pendTarget('Objetivo a maldecir',foes,(t)=>{const a=Math.max(2,Math.round(val));t._mods.push({cc:-a,ad:-a,he:-a,turns:2});pushFx({k:'status',side:tSide(t),id:t.id,txt:'▼'});pushLog('li',`${h.name} maldice a ${t.name} (-${a}).`);finishAct();});return;
    case 'buff': pendTarget('Aliado a bendecir',allies,(t)=>{const a=Math.max(2,Math.round(val));t._mods.push({cc:a,ad:a,he:a,turns:3});pushFx({k:'status',side:tSide(t),id:t.id,txt:'▲'});pushLog('lg',`${h.name} bendice a ${t.name} (+${a}).`);finishAct();});return;
  }
  finishAct();
}
function actItemMenu(){

    case 'mana': case 'manaBig': pendTarget('Aliado para restaurar maná',allies,(t)=>{const b=t.mana||0;t.mana=Math.min(t.maxMana||0,(t.mana||0)+o.val);const g=t.mana-b;pushFx({k:'manaup',side:tSide(t),id:t.id,amt:g});pushLog('lg',`${o.name}: ${t.name} +${g} de maná.`);consume();finishAct();});return;
    case 'revive': pendTarget('Aliado caído a revivir',allies,(t)=>{reviveHero(t,0.5);pushFx({k:'elite',side:tSide(t),id:t.id});pushLog('lx',`${o.name}: ¡${t.name} revive!`);consume();finishAct();},{allowDead:true});return;
    case 'reviveAll':{let any=false;G.team[allies].forEach(t=>{if(!t.alive){reviveHero(t,0.5);pushFx({k:'elite',side:tSide(t),id:t.id});any=true;}});pushLog('lx',`${o.name}: ${any?'¡todos reviven!':'no había caídos.'}`);consume();finishAct();return;}
  }
  finishAct();
}
function reviveHero(t,frac){
  const tmpl=byId(HEROES,t.id); const baseHp=tmpl?tmpl.hp:t.maxHp;
  t.alive=true; t.eliteMode=false; t.maxHp=baseHp+(t.armor?t.armor.hp:0);
  t.hp=Math.max(1,Math.round(t.maxHp*frac)); t.mana=t.maxMana||0;
  t.shield=0;t.sleep=0;t.para=0;t.skip=0;t.silence=0;t.evade=0;t.mark=null;t._mods=[];t.wardVal=0;t.wardTurns=0;
}
